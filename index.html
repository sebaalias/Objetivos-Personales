<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Objetivos personales</title>
<meta name="theme-color" content="#16241F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Objetivos">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#16241F;
    --paper:#EDE7D6;
    --paper-2:#E3DCC7;
    --ink:#1B2B24;
    --ink-soft:#4B5A52;
    --ocean:#2F6F8F;
    --ocean-dark:#1F4E66;
    --gold:#B9862E;
    --gold-light:#EFDBAF;
    --coral:#B9634A;
    --line: rgba(27,43,36,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Inter',sans-serif;}
  .app{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--paper);
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom));
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
  }
  .masthead{
    border-bottom:1px solid rgba(237,231,214,0.25);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  .masthead h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .masthead .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:rgba(237,231,214,0.65);
    text-transform:capitalize;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:20px;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid rgba(237,231,214,0.25);
    background:transparent;
    color:rgba(237,231,214,0.75);
    cursor:pointer;
  }
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    border-color:var(--paper);
  }
  .gauge-wrap{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:24px;
  }
  .gauge{
    width:64px;
    height:64px;
    border-radius:50%;
    background:conic-gradient(var(--gold) calc(var(--pct) * 1%), rgba(237,231,214,0.14) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .gauge-inner{
    width:50px;
    height:50px;
    border-radius:50%;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .gauge-label{
    font-size:13px;
    color:rgba(237,231,214,0.75);
    line-height:1.5;
  }
  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    padding:16px 18px 8px;
    margin-bottom:14px;
  }
  .card-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .card-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ocean-dark);
    font-weight:500;
    margin-right:8px;
  }
  .card-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:16px;
    flex:1;
  }
  .card-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ocean-dark);
    background:rgba(47,111,143,0.12);
    padding:2px 6px;
    border-radius:8px;
  }
  .card-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .item-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .checkbox{
    width:22px;
    height:22px;
    border-radius:5px;
    border:1.5px solid var(--ocean-dark);
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .checkbox.checked{
    background:var(--ocean);
    border-color:var(--ocean);
  }
  .checkbox svg{width:13px;height:13px;display:none;}
  .checkbox.checked svg{display:block;}
  .item-label{
    flex:1;
    font-size:14px;
  }
  .item-note{
    font-size:11px;
    color:var(--ink-soft);
    display:block;
  }
  .priority-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--gold);
    display:inline-block;
    margin-right:6px;
    flex-shrink:0;
    vertical-align:middle;
  }
  .item-row.done .item-label{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(27,43,36,0.35);
  }
  .streak{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--gold);
    min-width:30px;
    text-align:right;
  }
  .streak.zero{color:rgba(27,43,36,0.3);}
  .empty-note{
    font-size:13px;
    color:rgba(237,231,214,0.6);
    text-align:center;
    padding:20px 0;
  }
  .add-link{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    color:var(--ocean-dark);
    padding:9px 0;
    cursor:pointer;
  }
  .add-link-cat{
    color:var(--paper);
    text-align:left;
    padding-left:14px;
    font-size:13px;
    padding-top:10px;
    padding-bottom:10px;
    border:1px dashed rgba(237,231,214,0.3);
    border-radius:10px;
  }
  .add-row{
    display:flex;
    gap:6px;
    padding:8px 0;
    flex-wrap:wrap;
  }
  .add-input{
    flex:1;
    min-width:120px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  .add-confirm, .add-cancel{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    padding:8px 12px;
    border-radius:6px;
    border:1px solid var(--ocean-dark);
    background:var(--ocean);
    color:var(--paper);
    cursor:pointer;
  }
  .add-cancel{
    background:transparent;
    color:var(--ink-soft);
    border-color:var(--line);
  }
  .add-error{
    font-size:11.5px;
    color:var(--coral);
    width:100%;
  }
  .row-actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .icon-btn{
    width:28px;
    height:28px;
    border:none;
    background:transparent;
    color:rgba(27,43,36,0.4);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    flex-shrink:0;
  }
  .icon-btn svg{width:15px;height:15px;}
  .icon-btn.star-btn.active{color:var(--gold);}
  .icon-btn.trash-btn:hover{color:var(--coral);}
  .cat-head-actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .confirm-item-row{
    background:rgba(185,99,74,0.08);
    border-radius:6px;
    padding:8px 8px;
  }
  .confirm-item-row span{font-size:13px;flex:1;}
  .btn-danger, .btn-danger-sm{
    font-family:'Inter',sans-serif;
    padding:6px 12px;
    border-radius:6px;
    border:1px solid var(--coral);
    background:var(--coral);
    color:#fff;
    cursor:pointer;
    font-size:12.5px;
  }
  .btn-danger-sm{padding:5px 10px;font-size:12px;}
  .confirm-block{
    font-size:13px;
    color:var(--ink-soft);
    padding:6px 0 12px;
  }
  .confirm-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .hist-table{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
  }
  .hist-table th{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    color:var(--ink-soft);
    padding:4px 2px;
    text-align:center;
  }
  .hist-table td{
    text-align:center;
    padding:6px 2px;
  }
  .hist-item-label{
    text-align:left !important;
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding-right:6px !important;
    white-space:nowrap;
  }
  .dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:1.3px solid var(--ocean-dark);
    display:inline-block;
  }
  .dot.on{
    background:var(--gold);
    border-color:var(--gold);
  }
  .dot.na{
    border:1.3px dashed rgba(27,43,36,0.25);
    background:transparent;
  }
  .dot-btn{
    width:14px;
    height:14px;
    border-radius:50%;
    border:1.3px solid var(--ocean-dark);
    background:transparent;
    padding:0;
    cursor:pointer;
  }
  .dot-btn.on{
    background:var(--gold);
    border-color:var(--gold);
  }
  .dot-btn.skip{
    background:repeating-linear-gradient(45deg, rgba(122,58,58,0.5), rgba(122,58,58,0.5) 2px, transparent 2px, transparent 4px);
    border-color:rgba(122,58,58,0.6);
  }
  .item-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--ocean-dark);
    background:rgba(47,111,143,0.1);
    padding:1px 5px;
    border-radius:6px;
    margin-left:6px;
  }
  .freq-editor{
    background:rgba(47,111,143,0.06);
    border-radius:8px;
    padding:10px 10px 8px;
    margin:0 0 9px;
  }
  .freq-options{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .freq-opt{
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:6px 10px;
    border-radius:14px;
    border:1px solid var(--ocean-dark);
    background:transparent;
    color:var(--ocean-dark);
    cursor:pointer;
  }
  .freq-opt.active{
    background:var(--ocean);
    color:#fff;
    border-color:var(--ocean);
  }
  .freq-days{
    display:flex;
    gap:5px;
    margin-bottom:8px;
  }
  .day-chip{
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    cursor:pointer;
  }
  .day-chip.on{
    background:var(--ocean);
    border-color:var(--ocean);
    color:#fff;
  }
  .hist-item-label.is-priority{
    font-weight:600;
  }
  .hist-cat-row td{
    background:var(--paper-2);
    text-align:left !important;
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:12.5px;
    color:var(--ocean-dark);
    padding:7px 6px !important;
  }
  .metric-row{
    display:flex;
    gap:12px;
    margin-bottom:14px;
  }
  .metric-card{
    flex:1;
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    padding:14px 16px;
    text-align:center;
  }
  .metric-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .metric-value{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
  }
  .prio-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .prio-row:last-child{border-bottom:none;}
  .prio-name{flex:1;}
  .prio-ratio{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ocean-dark);
  }
  .link-btn{
    background:transparent;
    border:none;
    color:var(--gold-light);
    text-decoration:underline;
    font-size:12.5px;
    cursor:pointer;
    padding:0;
  }
  .start-screen{
    text-align:center;
    padding:48px 20px;
  }
  .start-screen h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    margin:0 0 10px;
  }
  .start-screen p{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0 0 22px;
  }
  .start-screen button{
    padding:12px 26px;
    font-size:14.5px;
  }
  .start-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 30px;
    border-radius:999px;
    border:none;
    background:var(--gold);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.12s ease;
  }
  .start-btn svg{width:16px;height:16px;}
  .start-btn:active{transform:scale(0.96);background:#A5761F;}
  .reset-row{
    text-align:center;
    padding:6px 0 0;
  }
  .reset-row .link-btn{color:rgba(237,231,214,0.5);}
  .loading{
    text-align:center;
    padding:40px 0;
    color:rgba(237,231,214,0.6);
    font-size:13px;
  }
  .backup-row{
    text-align:center;
    padding:18px 0 0;
    font-size:12px;
    color:rgba(237,231,214,0.45);
  }
  .backup-row .link-btn{
    color:rgba(237,231,214,0.55);
  }
  .backup-sep{margin:0 8px;color:rgba(237,231,214,0.25);}
  .import-panel{
    margin-top:12px;
  }
  .import-panel .confirm-block{
    background:var(--paper);
    border-radius:10px;
    padding:14px 16px;
  }
  @media (max-width:480px){
    .app{padding:20px 12px 40px;}
    .card{padding:14px 14px 6px;}
    .masthead h1{font-size:21px;}
    .hist-table{font-size:10px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <h1>Objetivos personales</h1>
    <div class="date" id="date-label">—</div>
  </div>
  <div class="tabs" id="tabs" style="display:none;">
    <button class="tab active" id="tab-hoy">Hoy</button>
    <button class="tab" id="tab-semana">Semana</button>
    <button class="tab" id="tab-resumen">Resumen</button>
    <button class="tab" id="tab-meses">Meses</button>
  </div>
  <div id="content" class="loading">Cargando…</div>
  <div class="backup-row">
    <button class="link-btn" id="export-btn">Exportar copia</button>
    <span class="backup-sep">·</span>
    <button class="link-btn" id="import-btn">Importar copia</button>
    <input type="file" id="import-file" accept="application/json" style="display:none;">
    <div class="import-panel" id="import-panel"></div>
  </div>
</div>
<script>
(function(){
  var CONFIG_KEY = 'op_config';
  var ENTRIES_KEY = 'op_entries';
  var SETTINGS_KEY = 'op_settings';
  var MONTHLY_KEY = 'op_monthly';

  var ALL_DAYS = [0,1,2,3,4,5,6];
  var WEEKDAYS_ONLY = [1,2,3,4,5];

  function defaultConfig(){
    return [
      {id:'cuidado', num:'01', title:'Cuidado personal', items:[
        {id:'hidratacion', label:'Hidratación', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'alimentacion', label:'Alimentación', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'ejercicio', label:'Ejercicio físico', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'entrenamiento', label:'Entrenamiento', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'surf', label:'Surf', priority:false, frequency:'daily', days:ALL_DAYS.slice()}
      ]},
      {id:'desarrollo', num:'02', title:'Desarrollo personal', items:[
        {id:'lectura', label:'Lectura', priority:false, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'idioma', label:'Idioma', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'estudio', label:'Investigación / Estudio', priority:false, frequency:'daily', days:ALL_DAYS.slice()}
      ]},
      {id:'admin', num:'03', title:'Actividades administrativas', items:[
        {id:'hogar', label:'Tareas del hogar', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'cotidiana', label:'Cotidiana', priority:false, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'adicionales', label:'Adicionales', priority:false, frequency:'daily', days:ALL_DAYS.slice()}
      ]},
      {id:'trabajo', num:'04', title:'Trabajo', items:[
        {id:'ml', label:'ML', priority:true, frequency:'daily', days:WEEKDAYS_ONLY.slice()},
        {id:'amazon', label:'Amazon', priority:false, frequency:'daily', days:WEEKDAYS_ONLY.slice()},
        {id:'otro', label:'Otro', priority:false, frequency:'daily', days:WEEKDAYS_ONLY.slice()},
        {id:'emprendimientos', label:'Emprendimientos', priority:false, frequency:'daily', days:WEEKDAYS_ONLY.slice()}
      ]}
    ];
  }

  function migrateConfig(cfg){
    (cfg || []).forEach(function(cat){
      var legacyWeekdaysOnly = !!cat.weekdaysOnly;
      (cat.items || []).forEach(function(item){
        if(!item.frequency) item.frequency = 'daily';
        if(item.frequency === 'daily' && !item.days){
          item.days = legacyWeekdaysOnly ? WEEKDAYS_ONLY.slice() : ALL_DAYS.slice();
        }
      });
    });
    return cfg;
  }

  var config = [];
  var entries = {};
  var monthlyEntries = {};
  var settings = {startDate:null};
  var currentTab = 'hoy';
  var openAddItemFor = null;
  var openAddCategory = false;
  var confirmDeleteItem = null;
  var confirmDeleteCat = null;
  var editingFreqFor = null;
  var expandedMonth = null;
  var editingItemLabelFor = null;
  var editingCatTitleFor = null;
  var contentEl = document.getElementById('content');
  var dateLabelEl = document.getElementById('date-label');
  var tabsEl = document.getElementById('tabs');
  var storageOk = true;

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseKey(key){ var p = key.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function todayKey(){ return dateKey(new Date()); }
  function isWeekend(d){ var day = d.getDay(); return day===0 || day===6; }
  function isBeforeStart(key){ return !!settings.startDate && key < settings.startDate; }
  function monthKey(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
  function isDayRequired(item, d){
    if(item.frequency === 'monthly') return false;
    var days = item.days || ALL_DAYS;
    return days.indexOf(d.getDay()) > -1;
  }
  function daysTagText(item){
    if(item.frequency === 'monthly') return 'mensual';
    var days = (item.days || ALL_DAYS).slice().sort();
    if(days.length === 0) return 'sin día fijo';
    if(days.length === 7) return null;
    var joined = days.join(',');
    if(joined === '1,2,3,4,5') return 'L\u2013V';
    if(joined === '1,2,3,4,5,6') return 'L\u2013S';
    var abbr = ['D','L','M','X','J','V','S'];
    return days.map(function(d){ return abbr[d]; }).join(',');
  }

  var WEEKDAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
  var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function formatMasthead(){
    var d = new Date();
    dateLabelEl.textContent = WEEKDAYS[d.getDay()]+', '+d.getDate()+' de '+MONTHS[d.getMonth()];
  }
  function formatDateHuman(key){
    var d = parseKey(key);
    return d.getDate()+' de '+MONTHS[d.getMonth()];
  }

  function slugify(str){
    return (str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')) || 'item';
  }
  function allIds(){
    var ids = [];
    config.forEach(function(c){ ids.push(c.id); c.items.forEach(function(i){ ids.push(i.id); }); });
    return ids;
  }
  function uniqueId(base){
    var ids = allIds();
    var id = base, n = 1;
    while(ids.indexOf(id) > -1){ id = base+'-'+n; n++; }
    return id;
  }
  function findCatOfItem(itemId){
    for(var i=0;i<config.length;i++){
      for(var j=0;j<config[i].items.length;j++){
        if(config[i].items[j].id === itemId) return config[i];
      }
    }
    return null;
  }

  function computeStreak(itemId, days){
    if(!days) return 0;
    var streak = 0;
    var d = new Date();
    var tKey = todayKey();
    var includeToday = entries[tKey] && entries[tKey][itemId] === true;
    if(!includeToday){ d.setDate(d.getDate()-1); }
    var guard = 0;
    while(guard < 3650){
      guard++;
      var kCheck = dateKey(d);
      if(isBeforeStart(kCheck)) break;
      if(days.indexOf(d.getDay()) === -1){ d.setDate(d.getDate()-1); continue; }
      var key = dateKey(d);
      var val = entries[key] && entries[key][itemId];
      if(val === 'skip'){ d.setDate(d.getDate()-1); continue; }
      if(val === true){
        streak++;
        d.setDate(d.getDate()-1);
      } else { break; }
    }
    return streak;
  }

  function dayCompletion(key){
    var d = parseKey(key);
    var rec = entries[key] || {};
    var done = 0, total = 0;
    config.forEach(function(cat){
      cat.items.forEach(function(item){
        if(item.frequency === 'monthly') return;
        if(!isDayRequired(item, d)) return;
        if(rec[item.id] === 'skip') return;
        total++;
        if(rec[item.id] === true) done++;
      });
    });
    return {done:done, total:total, pct: total ? Math.round((done/total)*100) : 0};
  }

  function last7Days(){
    var days = [];
    for(var i=6;i>=0;i--){
      var d = new Date();
      d.setDate(d.getDate()-i);
      days.push(d);
    }
    return days;
  }

  function rangeStats(days){
    var totalDone=0, totalReq=0, prioDone=0, prioReq=0;
    days.forEach(function(d){
      var key = dateKey(d);
      if(isBeforeStart(key)) return;
      var rec = entries[key] || {};
      config.forEach(function(cat){
        cat.items.forEach(function(item){
          if(item.frequency === 'monthly') return;
          if(!isDayRequired(item, d)) return;
          if(rec[item.id] === 'skip') return;
          totalReq++;
          if(rec[item.id] === true) totalDone++;
          if(item.priority){
            prioReq++;
            if(rec[item.id] === true) prioDone++;
          }
        });
      });
    });
    return {totalDone:totalDone, totalReq:totalReq, prioDone:prioDone, prioReq:prioReq};
  }

  function weekStats(){
    return rangeStats(last7Days());
  }

  function daysInMonthRange(monthDate){
    var year = monthDate.getFullYear(), month = monthDate.getMonth();
    var first = new Date(year, month, 1);
    var last = new Date(year, month+1, 0);
    var today = new Date(); today.setHours(0,0,0,0);
    if(last > today) last = today;
    var days = [];
    var d = new Date(first);
    while(d <= last){
      days.push(new Date(d));
      d.setDate(d.getDate()+1);
    }
    return days;
  }

  function buildMonthsList(){
    var months = [];
    var cursor = new Date();
    cursor.setDate(1);
    cursor.setHours(0,0,0,0);
    var startMonthKey = settings.startDate ? monthKey(parseKey(settings.startDate)) : monthKey(cursor);
    var guard = 0;
    while(guard < 24){
      guard++;
      months.push(new Date(cursor));
      if(monthKey(cursor) === startMonthKey) break;
      cursor.setMonth(cursor.getMonth()-1);
    }
    return months;
  }

  function allDaysSinceStart(){
    if(!settings.startDate) return [];
    var start = parseKey(settings.startDate);
    var today = new Date();
    today.setHours(0,0,0,0);
    var days = [];
    var d = new Date(start);
    var guard = 0;
    while(d <= today && guard < 3660){
      guard++;
      days.push(new Date(d));
      d.setDate(d.getDate()+1);
    }
    return days;
  }

    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function saveConfig(){

  }

  function toggleItem(itemId){
    var key = todayKey();
    if(!entries[key]) entries[key] = {};
    entries[key][itemId] = !entries[key][itemId];
    saveEntries();
    render();
  }

  function toggleMonthlyItem(itemId){
    var mk = monthKey();
    if(!monthlyEntries[mk]) monthlyEntries[mk] = {};
    monthlyEntries[mk][itemId] = !monthlyEntries[mk][itemId];
    saveMonthly();
    render();

  function findItemById(itemId){
    for(var i=0;i<config.length;i++){
      for(var j=0;j<config[i].items.length;j++){
        if(config[i].items[j].id === itemId) return config[i].items[j];
      }
    }
    return null;
  }

  function moveCategory(catId, dir){
    var idx = config.findIndex(function(c){ return c.id === catId; });
    if(idx === -1) return;
    var newIdx = idx + dir;
    if(newIdx < 0 || newIdx >= config.length) return;
    var tmp = config[idx];
    config[idx] = config[newIdx];
    config[newIdx] = tmp;
    config.forEach(function(c, i){ c.num = pad(i+1); });
    saveConfig();
    render();
  }

  function setItemFrequency(itemId, mode){
    var item = findItemById(itemId);
    if(!item) return;
    if(mode === 'daily-all'){ item.frequency = 'daily'; item.days = ALL_DAYS.slice(); }
    else if(mode === 'daily-weekdays'){ item.frequency = 'daily'; item.days = WEEKDAYS_ONLY.slice(); }
    else if(mode === 'monthly'){ item.frequency = 'monthly'; }
    else if(mode === 'no-schedule'){ item.frequency = 'daily'; item.days = []; }
    saveConfig();
    render();
  }

  function toggleItemDay(itemId, day){
    var item = findItemById(itemId);
    if(!item) return;
    item.frequency = 'daily';
    if(!item.days) item.days = ALL_DAYS.slice();
    var idx = item.days.indexOf(day);
    if(idx > -1){ if(item.days.length > 1) item.days.splice(idx,1); }
    else { item.days.push(day); }
    saveConfig();
    render();
  }

  function addItem(catId, label, errorHolder){
    label = (label || '').trim();
    if(!label){ errorHolder.msg = 'Escribí un nombre para el ítem.'; render(); return; }
    var cat = null;
    for(var i=0;i<config.length;i++){ if(config[i].id === catId){ cat = config[i]; break; } }
    if(!cat) return;
    var id = uniqueId(slugify(label));
    cat.items.push({id:id, label:label, priority:false, frequency:'daily', days:ALL_DAYS.slice()});
    openAddItemFor = null;
    saveConfig();
    render();
  }

  function addCategory(title, errorHolder){
    title = (title || '').trim();
    if(!title){ errorHolder.msg = 'Escribí un nombre para la categoría.'; render(); return; }
    var id = uniqueId(slugify(title));
    var num = pad(config.length + 1);
    config.push({id:id, num:num, title:title, weekdaysOnly:false, items:[]});
    openAddCategory = false;
    saveConfig();
    render();
  }

  function renameItem(itemId, newLabel){
    newLabel = (newLabel || '').trim();
    var item = findItemById(itemId);
    if(!item || !newLabel) { editingItemLabelFor = null; render(); return; }
    item.label = newLabel;
    editingItemLabelFor = null;
    saveConfig();
    render();
  }

  function renameCategory(catId, newTitle){
    newTitle = (newTitle || '').trim();
    var cat = config.find(function(c){ return c.id === catId; });
    if(!cat || !newTitle){ editingCatTitleFor = null; render(); return; }
    cat.title = newTitle;
    editingCatTitleFor = null;
    saveConfig();
    render();
  }

  function togglePriority(itemId){
    var cat = findCatOfItem(itemId);
    if(!cat) return;
    var item = null;
    for(var i=0;i<cat.items.length;i++){ if(cat.items[i].id === itemId){ item = cat.items[i]; break; } }
    if(!item) return;
    item.priority = !item.priority;
    saveConfig();
    render();
  }

  function deleteItemConfirmed(itemId){
    var cat = findCatOfItem(itemId);
    if(!cat) return;
    cat.items = cat.items.filter(function(i){ return i.id !== itemId; });
    confirmDeleteItem = null;
    saveConfig();
    render();
  }

  function deleteCategoryConfirmed(catId){

    confirmDeleteCat = null;

      renameCatInput.setSelectionRange(renameCatInput.value.length, renameCatInput.value.length);
      renameCatInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ renameCategory(editingCatTitleFor, renameCatInput.value); }
        else if(e.key === 'Escape'){ editingCatTitleFor = null; render(); }
      });
    }
    contentEl.querySelectorAll('[data-edititemlabel]').forEach(function(btn){
      btn.addEventListener('click', function(){ editingItemLabelFor = btn.getAttribute('data-edititemlabel'); render(); });
    });
    contentEl.querySelectorAll('[data-cancelitemlabel]').forEach(function(btn){
      btn.addEventListener('click', function(){ editingItemLabelFor = null; render(); });
    });
    contentEl.querySelectorAll('[data-saveitemlabel]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var input = document.getElementById('rename-item-input');
        renameItem(btn.getAttribute('data-saveitemlabel'), input ? input.value : '');
      });
    });
    var renameItemInput = document.getElementById('rename-item-input');
    if(renameItemInput){
      renameItemInput.focus();
      renameItemInput.setSelectionRange(renameItemInput.value.length, renameItemInput.value.length);
      renameItemInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){ renameItem(editingItemLabelFor, renameItemInput.value); }
        else if(e.key === 'Escape'){ editingItemLabelFor = null; render(); }
      });
    }
    contentEl.querySelectorAll('.trash-btn[data-delitem]').forEach(function(btn){
      btn.addEventListener('click', function(){ confirmDeleteItem = btn.getAttribute('data-delitem'); render(); });
    });
    contentEl.querySelectorAll('[data-confirmdelitem]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteItemConfirmed(btn.getAttribute('data-confirmdelitem')); });
    });
    contentEl.querySelectorAll('[data-canceldelitem]').forEach(function(btn){
      btn.addEventListener('click', function(){ confirmDeleteItem = null; render(); });
    });
    contentEl.querySelectorAll('.trash-btn[data-delcat]').forEach(function(btn){
      btn.addEventListener('click', function(){ confirmDeleteCat = btn.getAttribute('data-delcat'); render(); });
    });
    contentEl.querySelectorAll('[data-confirmdelcat]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteCategoryConfirmed(btn.getAttribute('data-confirmdelcat')); });
    });
    contentEl.querySelectorAll('[data-canceldelcat]').forEach(function(btn){
      btn.addEventListener('click', function(){ confirmDeleteCat = null; render(); });
    });
    contentEl.querySelectorAll('.add-link[data-addcat]').forEach(function(btn){
      btn.addEventListener('click', function(){
        openAddItemFor = btn.getAttribute('data-addcat');
        addItemError.msg = null;
        render();
      });
    });
    var confirmItemBtn = document.getElementById('confirm-add-item');
    if(confirmItemBtn){
      confirmItemBtn.addEventListener('click', function(){
        var val = document.getElementById('new-item-input').value;
        addItem(confirmItemBtn.getAttribute('data-cat'), val, addItemError);
      });
    }
    var cancelItemBtn = document.getElementById('cancel-add-item');
    if(cancelItemBtn){
      cancelItemBtn.addEventListener('click', function(){ openAddItemFor = null; addItemError.msg = null; render(); });
    }
    var openCatBtn = document.getElementById('open-add-category');
    if(openCatBtn){
      openCatBtn.addEventListener('click', function(){ openAddCategory = true; addCatError.msg = null; render(); });
    }
    var confirmCatBtn = document.getElementById('confirm-add-category');
    if(confirmCatBtn){
      confirmCatBtn.addEventListener('click', function(){
        var val = document.getElementById('new-cat-input').value;
        addCategory(val, addCatError);
      });
    }
    var cancelCatBtn = document.getElementById('cancel-add-category');
    if(cancelCatBtn){
      cancelCatBtn.addEventListener('click', function(){ openAddCategory = false; addCatError.msg = null; render(); });
    }
  }

  function renderSemana(){
    var days = last7Days();
    var html = '<div class="empty-note" style="padding:0 0 12px;text-align:left;">'+
      '<span class="priority-dot" style="margin-right:5px;"></span>negrita = prioritario &nbsp;&nbsp;<span class="dot na" style="width:9px;height:9px;vertical-align:-1px;"></span> no obligatorio ese día &nbsp;&nbsp;toc\u00e1 un punto: hecho \u2192 excepci\u00f3n (feriado, etc.) \u2192 vac\u00edo</div>';
    html += '<div class="card"><table class="hist-table"><thead><tr><th class="hist-item-label"></th>';
    days.forEach(function(d){
      html += '<th>'+WEEKDAYS[d.getDay()]+'<br>'+d.getDate()+'</th>';
    });
    html += '</tr></thead><tbody>';
    config.forEach(function(cat){
      var dailyItems = cat.items.filter(function(i){ return i.frequency !== 'monthly'; });
      if(!dailyItems.length) return;
      html += '<tr class="hist-cat-row"><td colspan="'+(days.length+1)+'"><span class="card-num">'+cat.num+'</span> '+cat.title+'</td></tr>';
      dailyItems.forEach(function(item){
        html += '<tr><td class="hist-item-label'+(item.priority?' is-priority':'')+'">'+item.label+'</td>';
        days.forEach(function(d){
          var key = dateKey(d);
          var required = isDayRequired(item, d) && !isBeforeStart(key);
          if(!required){
            html += '<td><span class="dot na"></span></td>';
          } else {
            var state = entries[key] && entries[key][item.id];
            var cls = state === true ? 'on' : (state === 'skip' ? 'skip' : '');
            var label = state === true ? 'hecho' : (state === 'skip' ? 'excepción' : 'sin marcar');
            html += '<td><button class="dot-btn '+cls+'" data-toggleitem="'+item.id+'" data-toggledate="'+key+'" aria-label="'+item.label+' '+key+' ('+label+')"></button></td>';
          }
        });
        html += '</tr>';
      });
    });
    html += '</tbody></table></div>';
    contentEl.innerHTML = html;
    contentEl.querySelectorAll('.dot-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var itemId = btn.getAttribute('data-toggleitem');
        var key = btn.getAttribute('data-toggledate');
        if(!entries[key]) entries[key] = {};
        var cur = entries[key][itemId];
        if(cur === true){ entries[key][itemId] = 'skip'; }
        else if(cur === 'skip'){ delete entries[key][itemId]; }
        else { entries[key][itemId] = true; }
        saveEntries();
        renderSemana();
      });
    });
  }

  function renderResumen(){
    var stats = weekStats();
    var pct = stats.totalReq ? Math.round((stats.totalDone/stats.totalReq)*100) : 0;
    var prioPct = stats.prioReq ? Math.round((stats.prioDone/stats.prioReq)*100) : 0;
    var html = '';

    html += '<div class="card" style="text-align:center;padding:24px 18px 20px;">';
    html += '<div class="metric-label" style="font-size:12.5px;">Prioritarios \u00b7 \u00faltimos 7 d\u00edas</div>';
    html += '<div class="metric-value" style="font-size:42px;margin:6px 0 2px;">'+prioPct+'%</div>';
    html += '<div class="metric-label">'+stats.prioDone+' de '+stats.prioReq+' cumplidos</div>';
    html += '</div>';

    html += '<div class="card"><div class="card-head"><span class="card-title" style="font-size:15px;">Detalle de prioritarios</span></div>';
    var days = last7Days();
    var any = false;
    config.forEach(function(cat){
      cat.items.forEach(function(item){
        if(!item.priority || item.frequency === 'monthly') return;
        any = true;
        var req = 0, done = 0;
        days.forEach(function(d){
          var key = dateKey(d);
          if(isBeforeStart(key)) return;
          if(!isDayRequired(item, d)) return;
          var rec = entries[key] || {};
          if(rec[item.id] === 'skip') return;
          req++;
          if(rec[item.id] === true) done++;
        });
        var streak = computeStreak(item.id, item.days || ALL_DAYS);
        html += '<div class="prio-row"><span class="priority-dot"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+done+'/'+req+' \u00b7 '+streak+'d racha</span></div>';
      });
    });
    if(!any) html += '<div class="empty-note">Todavía no marcaste ítems como prioritarios.</div>';
    html += '</div>';

    html += '<div class="metric-row">';
    html += '<div class="metric-card"><div class="metric-label">Cumplimiento general (7 d\u00edas)</div><div class="metric-value" style="font-size:20px;">'+pct+'%</div></div>';
    html += '</div>';

    var monthlyItems = [];
    config.forEach(function(cat){
      cat.items.forEach(function(item){ if(item.frequency === 'monthly') monthlyItems.push(item); });
    });
    if(monthlyItems.length){
      var mk = monthKey();
      html += '<div class="card"><div class="card-head"><span class="card-title" style="font-size:15px;">Mensuales</span><span class="card-count">'+MONTHS[new Date().getMonth()]+'</span></div>';
      monthlyItems.forEach(function(item){
        var done = !!(monthlyEntries[mk] && monthlyEntries[mk][item.id]);
        html += '<div class="prio-row"><span class="dot '+(done?'on':'')+'" style="margin-right:2px;"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+(done?'Hecho este mes':'Pendiente')+'</span></div>';
      });
      html += '</div>';
    }
    contentEl.innerHTML = html;
  }

  function renderMeses(){
    var months = buildMonthsList();
    var monthlyItems = [];
    var priorityItems = [];
    config.forEach(function(cat){
      cat.items.forEach(function(item){
        if(item.frequency === 'monthly') monthlyItems.push(item);
        else if(item.priority) priorityItems.push(item);
      });
    });
    var html = '';

    var overall = rangeStats(allDaysSinceStart());
    var overallPct = overall.totalReq ? Math.round((overall.totalDone/overall.totalReq)*100) : 0;
    var overallPrioPct = overall.prioReq ? Math.round((overall.prioDone/overall.prioReq)*100) : 0;
    var startLabel = settings.startDate ? formatDateHuman(settings.startDate) : '';
    var allDays = allDaysSinceStart();
    html += '<div class="card">';
    html += '<div style="font-size:13px;color:var(--ink-soft);padding:0 0 10px;">Acumulado desde el <strong style="color:var(--ink);">'+startLabel+'</strong></div>';
    html += '<div class="metric-row">';
    html += '<div class="metric-card"><div class="metric-label" style="font-size:11px;">Prioritarios</div><div class="metric-value" style="font-size:30px;">'+overallPrioPct+'%</div></div>';
    html += '<div class="metric-card"><div class="metric-label" style="font-size:11px;">General</div><div class="metric-value" style="font-size:18px;">'+overallPct+'%</div></div>';
    html += '</div>';
    if(priorityItems.length){
      html += '<button class="link-btn" data-toggleprio="__overall__" style="font-size:12px;">'+(expandedMonth==='__overall__'?'Ocultar detalle de prioritarios':'Ver detalle de prioritarios')+'</button>';
      if(expandedMonth === '__overall__'){
        priorityItems.forEach(function(item){
          var req = 0, done = 0;
          allDays.forEach(function(d){
            var key = dateKey(d);
            if(!isDayRequired(item, d)) return;
            var rec = entries[key] || {};
            if(rec[item.id] === 'skip') return;
            req++;
            if(rec[item.id] === true) done++;
          });
          html += '<div class="prio-row"><span class="priority-dot"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+done+'/'+req+'</span></div>';
        });
      }
    }
    html += '</div>';

    months.forEach(function(mDate, idx){
      var mk = monthKey(mDate);
      var days = daysInMonthRange(mDate);
      var stats = rangeStats(days);
      var pct = stats.totalReq ? Math.round((stats.totalDone/stats.totalReq)*100) : 0;
      var prioPct = stats.prioReq ? Math.round((stats.prioDone/stats.prioReq)*100) : 0;
      var label = MONTHS[mDate.getMonth()]+' '+mDate.getFullYear();
      html += '<div class="card">';
      html += '<div class="card-head"><span class="card-title" style="font-size:15px;text-transform:capitalize;">'+label+'</span></div>';
      if(stats.totalReq === 0){
        html += '<div class="empty-note">Sin actividad registrada este mes.</div>';
      } else {
        html += '<div class="metric-row" style="margin-bottom:10px;">';
        html += '<div class="metric-card" style="padding:10px 12px;"><div class="metric-label" style="font-size:11px;">Prioritarios</div><div class="metric-value" style="font-size:26px;">'+prioPct+'%</div></div>';
        html += '<div class="metric-card" style="padding:10px 12px;"><div class="metric-label" style="font-size:11px;">General</div><div class="metric-value" style="font-size:16px;">'+pct+'%</div></div>';
        html += '</div>';

        if(priorityItems.length){
          html += '<button class="link-btn" data-toggleprio="'+mk+'" style="font-size:12px;margin-bottom:6px;">'+(expandedMonth===mk?'Ocultar detalle de prioritarios':'Ver detalle de prioritarios')+'</button>';
          if(expandedMonth === mk){
            priorityItems.forEach(function(item){
              var req = 0, done = 0;
              days.forEach(function(d){
                var key = dateKey(d);
                if(isBeforeStart(key)) return;
                if(!isDayRequired(item, d)) return;
                var rec = entries[key] || {};
                if(rec[item.id] === 'skip') return;
                req++;
                if(rec[item.id] === true) done++;
              });
              html += '<div class="prio-row"><span class="priority-dot"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+done+'/'+req+'</span></div>';
            });
          }
        }
      }
      if(monthlyItems.length){
        monthlyItems.forEach(function(item){
          var done = !!(monthlyEntries[mk] && monthlyEntries[mk][item.id]);
          html += '<div class="prio-row"><span class="dot '+(done?'on':'')+'" style="margin-right:2px;"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+(done?'Hecho':'No hecho')+'</span></div>';
        });
      }
      html += '</div>';
    });
    if(!months.length) html = '<div class="empty-note">Todavía no hay historial mensual.</div>';
    contentEl.innerHTML = html;
    contentEl.querySelectorAll('[data-toggleprio]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var mk = btn.getAttribute('data-toggleprio');
        expandedMonth = (expandedMonth === mk) ? null : mk;
        renderMeses();
      });
    });
  }

  function render(){
    contentEl.className = '';
    if(!settings.startDate){ renderStartScreen(); return; }
    if(currentTab === 'hoy'){ renderHoy(); }
    else if(currentTab === 'semana'){ renderSemana(); }
    else if(currentTab === 'resumen'){ renderResumen(); }
    else { renderMeses(); }
  }

  function setActiveTab(tab, btn){
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');
    render();
  }

  document.getElementById('tab-hoy').addEventListener('click', function(){ setActiveTab('hoy', this); });
  document.getElementById('tab-semana').addEventListener('click', function(){ setActiveTab('semana', this); });
  document.getElementById('tab-resumen').addEventListener('click', function(){ setActiveTab('resumen', this); });
  document.getElementById('tab-meses').addEventListener('click', function(){ setActiveTab('meses', this); });

  var pendingImport = null;
  var importPanel = document.getElementById('import-panel');

  function exportData(){
    var payload = {config:config, entries:entries, monthlyEntries:monthlyEntries, settings:settings, exportedAt: todayKey()};
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'objetivos-personales-'+todayKey()+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function renderImportConfirm(){
    if(!pendingImport){ importPanel.innerHTML = ''; return; }
    var when = pendingImport.exportedAt ? formatDateHuman(pendingImport.exportedAt) : 'fecha desconocida';
    importPanel.innerHTML = '<div class="confirm-block">Este archivo es del '+when+'. Va a reemplazar todo tu progreso actual (categorías, ítems y días marcados). Esta acción no se puede deshacer.'+
      '<div class="confirm-actions"><button class="btn-danger" id="confirm-import">Sí, reemplazar</button><button class="add-cancel" id="cancel-import">Cancelar</button></div></div>';
    document.getElementById('confirm-import').addEventListener('click', function(){
      config = pendingImport.config || defaultConfig();
      migrateConfig(config);
      entries = pendingImport.entries || {};
      monthlyEntries = pendingImport.monthlyEntries || {};
      settings = pendingImport.settings || {startDate:null};
      saveConfig(); saveEntries(); saveMonthly(); saveSettings();
      pendingImport = null;
      importPanel.innerHTML = '';
      tabsEl.style.display = settings.startDate ? 'flex' : 'none';
      currentTab = 'hoy';
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      document.getElementById('tab-hoy').classList.add('active');
      render();
    });
    document.getElementById('cancel-import').addEventListener('click', function(){
      pendingImport = null;
      importPanel.innerHTML = '';
      document.getElementById('import-file').value = '';
    });
  }

  function handleImportFile(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var parsed = JSON.parse(ev.target.result);
        if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.config) || typeof parsed.entries !== 'object'){
          importPanel.innerHTML = '<div class="empty-note" style="color:var(--coral);">Este archivo no tiene el formato esperado.</div>';
          return;
        }
        pendingImport = parsed;
        renderImportConfirm();
      }catch(err){
        importPanel.innerHTML = '<div class="empty-note" style="color:var(--coral);">No se pudo leer el archivo. ¿Es un .json exportado desde acá?</div>';
      }
    };
    reader.readAsText(file);
  }

  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', function(){ document.getElementById('import-file').click(); });
  document.getElementById('import-file').addEventListener('change', handleImportFile);

  function init(){
    formatMasthead();
    try{
      var cfgRaw = localStorage.getItem(CONFIG_KEY);
      config = cfgRaw ? JSON.parse(cfgRaw) : null;
    }catch(e){ config = null; storageOk = false; }
    if(!config){ config = defaultConfig(); }
    migrateConfig(config);
    saveConfig();
    try{
      var entRaw = localStorage.getItem(ENTRIES_KEY);
      entries = entRaw ? JSON.parse(entRaw) : {};
    }catch(e){ entries = {}; storageOk = false; }
    try{
      var monRaw = localStorage.getItem(MONTHLY_KEY);
      monthlyEntries = monRaw ? JSON.parse(monRaw) : {};
    }catch(e){ monthlyEntries = {}; storageOk = false; }
    try{
      var setRaw = localStorage.getItem(SETTINGS_KEY);
      settings = setRaw ? JSON.parse(setRaw) : {startDate:null};
    }catch(e){ settings = {startDate:null}; storageOk = false; }
    if(settings.startDate){ tabsEl.style.display = 'flex'; }
    render();
  }

  init();
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.error('SW error', e); });
  });
}
</script>
