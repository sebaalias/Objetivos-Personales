<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Seguimiento Personal</title>
<meta name="theme-color" content="#16241F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seguimiento">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#16241F;
    --paper:#EDE7D6;
    --paper-2:#E3DCC7;
    --ink:#1B2B24;
    --ink-soft:#4B5A52;
    --ocean:#2F6F8F;
    --ocean-dark:#1F4E66;
    --gold:#B9862E;
    --gold-light:#EFDBAF;
    --coral:#B9634A;
    --line: rgba(27,43,36,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Inter',sans-serif;}
  .app{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--paper);
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom));
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
  }
  .masthead{
    border-bottom:1px solid rgba(237,231,214,0.25);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  .masthead h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .masthead .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:rgba(237,231,214,0.65);
    text-transform:capitalize;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:20px;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid rgba(237,231,214,0.25);
    background:transparent;
    color:rgba(237,231,214,0.75);
    cursor:pointer;
  }
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    border-color:var(--paper);
  }
  .subtabs{
    margin-top:-10px;
    margin-bottom:20px;
  }
  .subtabs .tab{
    font-size:12px;
    padding:6px 12px;
    border-color:rgba(237,231,214,0.15);
    color:rgba(237,231,214,0.55);
  }
  .subtabs .tab.active{
    background:transparent;
    color:var(--gold);
    border-color:var(--gold);
  }
  .gauge-wrap{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:24px;
  }
  .gauge{
    width:64px;
    height:64px;
    border-radius:50%;
    background:conic-gradient(var(--gold) calc(var(--pct) * 1%), rgba(237,231,214,0.14) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .gauge-inner{
    width:50px;
    height:50px;
    border-radius:50%;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .gauge-label{
    font-size:13px;
    color:rgba(237,231,214,0.75);
    line-height:1.5;
  }
  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    padding:16px 18px 8px;
    margin-bottom:14px;
  }
  .card-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .card-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ocean-dark);
    font-weight:500;
    margin-right:8px;
  }
  .card-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:16px;
    flex:1;
  }
  .card-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ocean-dark);
    background:rgba(47,111,143,0.12);
    padding:2px 6px;
    border-radius:8px;
  }
  .card-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .item-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .checkbox{
    width:22px;
    height:22px;
    border-radius:5px;
    border:1.5px solid var(--ocean-dark);
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .checkbox.checked{
    background:var(--ocean);
    border-color:var(--ocean);
  }
  .checkbox svg{width:13px;height:13px;display:none;}
  .checkbox.checked svg{display:block;}
  .item-label{
    flex:1;
    font-size:14px;
  }
  .item-note{
    font-size:11px;
    color:var(--ink-soft);
    display:block;
  }
  .priority-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--gold);
    display:inline-block;
    margin-right:6px;
    flex-shrink:0;
    vertical-align:middle;
  }
  .item-row.done .item-label{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(27,43,36,0.35);
  }
  .streak{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--gold);
    min-width:30px;
    text-align:right;
  }
  .streak.zero{color:rgba(27,43,36,0.3);}
  .empty-note{
    font-size:13px;
    color:rgba(237,231,214,0.6);
    text-align:left;
    padding:20px 0;
  }
  .add-link{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    color:var(--ocean-dark);
    padding:9px 0;
    cursor:pointer;
  }
  .add-link-cat{
    color:var(--paper);
    text-align:left;
    padding-left:14px;
    font-size:13px;
    padding-top:10px;
    padding-bottom:10px;
    border:1px dashed rgba(237,231,214,0.3);
    border-radius:10px;
  }
  .add-row{
    display:flex;
    gap:6px;
    padding:8px 0;
    flex-wrap:wrap;
  }
  .add-input{
    flex:1;
    min-width:120px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  .add-confirm, .add-cancel{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    padding:8px 12px;
    border-radius:6px;
    border:1px solid var(--ocean-dark);
    background:var(--ocean);
    color:var(--paper);
    cursor:pointer;
  }
  .add-cancel{
    background:transparent;
    color:var(--ink-soft);
    border-color:var(--line);
  }
  .add-error{
    font-size:11.5px;
    color:var(--coral);
    width:100%;
  }
  .row-actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .icon-btn{
    width:28px;
    height:28px;
    border:none;
    background:transparent;
    color:rgba(27,43,36,0.4);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    flex-shrink:0;
  }
  .icon-btn svg{width:15px;height:15px;}
  .icon-btn.star-btn.active{color:var(--gold);}
  .icon-btn.trash-btn:hover{color:var(--coral);}
  .cat-head-actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .confirm-item-row{
    background:rgba(185,99,74,0.08);
    border-radius:6px;
    padding:8px 8px;
  }
  .confirm-item-row span{font-size:13px;flex:1;}
  .btn-danger, .btn-danger-sm{
    font-family:'Inter',sans-serif;
    padding:6px 12px;
    border-radius:6px;
    border:1px solid var(--coral);
    background:var(--coral);
    color:#fff;
    cursor:pointer;
    font-size:12.5px;
  }
  .btn-danger-sm{padding:5px 10px;font-size:12px;}
  .confirm-block{
    font-size:13px;
    color:var(--ink-soft);
    padding:6px 0 12px;
  }
  .confirm-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .hist-table{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
  }
  .hist-table th{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    color:var(--ink-soft);
    padding:4px 2px;
    text-align:center;
  }
  .hist-table td{
    text-align:center;
    padding:6px 2px;
  }
  .hist-item-label{
    text-align:left !important;
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding-right:6px !important;
    white-space:nowrap;
  }
  .dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:1.3px solid var(--ocean-dark);
    display:inline-block;
  }
  .dot.on{
    background:var(--gold);
    border-color:var(--gold);
  }
  .dot.na{
    border:1.3px dashed rgba(27,43,36,0.25);
    background:transparent;
  }
  .dot-btn{
    width:14px;
    height:14px;
    border-radius:50%;
    border:1.3px solid var(--ocean-dark);
    background:transparent;
    padding:0;
    cursor:pointer;
  }
  .dot-btn.on{
    background:var(--gold);
    border-color:var(--gold);
  }
  .dot-btn.skip{
    background:repeating-linear-gradient(45deg, rgba(122,58,58,0.5), rgba(122,58,58,0.5) 2px, transparent 2px, transparent 4px);
    border-color:rgba(122,58,58,0.6);
  }
  .dot-btn.optional{
    border-style:dashed;
    opacity:0.6;
  }
  .dot-btn.optional.on{
    opacity:1;
  }
  .item-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    color:var(--ocean-dark);
    background:rgba(47,111,143,0.1);
    padding:1px 5px;
    border-radius:6px;
    margin-left:6px;
  }
  .freq-editor{
    background:rgba(47,111,143,0.06);
    border-radius:8px;
    padding:10px 10px 8px;
    margin:0 0 9px;
  }
  .freq-options{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .freq-opt{
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:6px 10px;
    border-radius:14px;
    border:1px solid var(--ocean-dark);
    background:transparent;
    color:var(--ocean-dark);
    cursor:pointer;
  }
  .freq-opt.active{
    background:var(--ocean);
    color:#fff;
    border-color:var(--ocean);
  }
  .freq-days{
    display:flex;
    gap:5px;
    margin-bottom:8px;
  }
  .day-chip{
    width:28px;
    height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    cursor:pointer;
  }
  .day-chip.on{
    background:var(--ocean);
    border-color:var(--ocean);
    color:#fff;
  }
  .hist-item-label.is-priority{
    font-weight:600;
  }
  .hist-cat-row td{
    background:var(--paper-2);
    text-align:left !important;
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:12.5px;
    color:var(--ocean-dark);
    padding:7px 6px !important;
  }
  .metric-row{
    display:flex;
    gap:12px;
    margin-bottom:14px;
  }
  .metric-card{
    flex:1;
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    padding:14px 16px;
    text-align:center;
  }
  .metric-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .metric-value{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
  }
  .prio-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .prio-row:last-child{border-bottom:none;}
  .prio-name{flex:1;}
  .prio-ratio{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ocean-dark);
  }
  .link-btn{
    background:transparent;
    border:none;
    color:var(--gold-light);
    text-decoration:underline;
    font-size:12.5px;
    cursor:pointer;
    padding:0;
  }
  .start-screen{
    text-align:center;
    padding:48px 20px;
  }
  .start-screen h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    margin:0 0 10px;
  }
  .start-screen p{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0 0 22px;
  }
  .start-screen button{
    padding:12px 26px;
    font-size:14.5px;
  }
  .start-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 30px;
    border-radius:999px;
    border:none;
    background:var(--gold);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.12s ease;
  }
  .start-btn svg{width:16px;height:16px;}
  .start-btn:active{transform:scale(0.96);background:#A5761F;}
  .reset-row{
    text-align:center;
    padding:6px 0 0;
  }
  .reset-row .link-btn{color:rgba(237,231,214,0.5);}
  .loading{
    text-align:center;
    padding:40px 0;
    color:rgba(237,231,214,0.6);
    font-size:13px;
  }
  .backup-row{
    text-align:center;
    padding:18px 0 0;
    font-size:12px;
    color:rgba(237,231,214,0.45);
  }
  .backup-row .link-btn{
    color:rgba(237,231,214,0.55);
  }
  .backup-sep{margin:0 8px;color:rgba(237,231,214,0.25);}
  .import-panel{
    margin-top:12px;
  }
  .import-panel .confirm-block{
    background:var(--paper);
    border-radius:10px;
    padding:14px 16px;
  }
  .field-label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    font-weight:600;
    margin:12px 0 4px;
  }
  .field-input, .field-textarea{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  .field-textarea{resize:vertical;min-height:60px;line-height:1.4;font-family:inherit;}
  .field-row2{display:flex;gap:10px;}
  .field-row2 > div{flex:1;}
  .health-actions{
    display:flex;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .health-save-btn{
    flex:1;
    min-width:120px;
    padding:11px 16px;
    font-size:14px;
    border-radius:8px;
    border:1px solid var(--ocean-dark);
    background:var(--ocean);
    color:var(--paper);
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:500;
  }
  .health-cancel-btn{
    padding:11px 16px;
    font-size:14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .ai-btn-row{
    display:flex;
    gap:8px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .ai-btn{
    flex:1;
    min-width:130px;
    padding:11px 14px;
    font-size:13.5px;
    border-radius:8px;
    border:1px solid var(--gold);
    background:var(--gold);
    color:var(--ink);
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:600;
  }
  .ai-btn.secondary{
    background:transparent;
    color:var(--paper);
    border-color:rgba(237,231,214,0.3);
  }
  .goal-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .goal-row:last-child{border-bottom:none;}
  .goal-main{flex:1;}
  .goal-label{font-weight:600;}
  .goal-detail{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace;
    margin-top:2px;
  }
  .entry-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ocean-dark);
    min-width:38px;
    padding-top:1px;
  }
  .entry-main{flex:1;}
  .entry-macros{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .totals-card{
    background:var(--paper);
    border-radius:10px;
    padding:14px 16px;
  }
  .field-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin:12px 0 4px;
    flex-wrap:nowrap;
  }
  .field-header .field-label{margin:0;flex:1;}
  .field-header.compact{margin:8px 0 3px;}
  .field-input.compact{
    padding:6px 8px;
    font-size:13.5px;
    text-align:center;
  }
  .na-toggle{
    font-size:10.5px;
    font-family:'IBM Plex Mono',monospace;
    padding:2px 8px;
    border-radius:10px;
    border:1px dashed rgba(27,43,36,0.28);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
  }
  .na-toggle.active{
    border-style:solid;
    border-color:var(--gold);
    color:var(--gold);
    background:rgba(185,134,46,0.12);
  }
  .field-input:disabled, .field-textarea:disabled{
    opacity:0.45;
    text-decoration:line-through;
    background:rgba(27,43,36,0.03);
  }
  .total-block{
    padding:8px 0;
    border-bottom:1px solid var(--line);
  }
  .total-block:last-child{border-bottom:none;}
  .total-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .total-label{font-size:13px;color:var(--ink-soft);}
  .total-value{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;}
  .total-sub{
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
    margin-top:2px;
  }
  .day-status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    padding:4px 10px;
    border-radius:12px;
    font-family:'IBM Plex Mono',monospace;
  }
  .day-status.open{background:rgba(47,111,143,0.15);color:var(--ocean-dark);}
  .day-status.closed{background:rgba(185,134,46,0.18);color:var(--gold);}
  .day-status.empty{background:rgba(27,43,36,0.08);color:var(--ink-soft);}
  .toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--gold);
    color:var(--ink);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    box-shadow:0 4px 14px rgba(0,0,0,0.3);
    z-index:999;
  }
  @media (max-width:480px){
    .app{padding:20px 12px 40px;}
    .card{padding:14px 14px 6px;}
    .masthead h1{font-size:21px;}
    .hist-table{font-size:10px;}

<script>
(function(){
  var CONFIG_KEY = 'op_config';
  var ENTRIES_KEY = 'op_entries';
  var SETTINGS_KEY = 'op_settings';
  var MONTHLY_KEY = 'op_monthly';
  var GOALS_KEY = 'op_goals';
  var GOAL_HISTORY_KEY = 'op_goal_history';
  var HEALTH_KEY = 'op_health';
  var PARAMS_KEY = 'op_params';

  function defaultGoals(){
    return [
      {id:'peso', label:'Peso', target:'76 kg', date:'2026-09-18'},
      {id:'calorias', label:'Calorías', target:'1700–1800 kcal/día', date:''},
      {id:'proteina', label:'Proteína', target:'120–130 g/día', date:''},
      {id:'hidratacion', label:'Hidratación', target:'2–2.5 L/día', date:''}

  }
  function defaultParamsNotes(){
    return 'Objetivo: llegar en la mejor forma física posible al 18/09; esfuerzo alto pero sostenible.\n'+
      'Objetivo corporal: bajar grasa (especialmente abdominal) preservando/ganando masa muscular, manteniendo agilidad y rendimiento para surf.\n'+
      'Altura: 175.5 cm.\n'+
      'Rutina matutina: 3 series de 10 flexiones, 10 sentadillas, 20 abdominales/crunches, 15 espinales alternados.\n'+
      'Creatina: monohidrato Star Nutrition, 5 g/día.\n'+
      'Whey: Gold Nutrition 100% Whey Protein Pure Unflavored, ~28 g proteína por scoop.\n'+
      'Hydromax: reservado para sesiones de natación/intensidad, no como bebida rutinaria.\n'+
      'Alimentos habituales: pan Mi Mago Doble integral, Port Salut Maricré, yogur griego La Serenísima, granola GoNatural Crunch, leche descremada.\n'+
      'Preferencia: no le gusta el arroz.';
  }

  var ALL_DAYS = [0,1,2,3,4,5,6];
  var WEEKDAYS_ONLY = [1,2,3,4,5];

  function defaultConfig(){
    return [
      {id:'cuidado', num:'01', title:'Cuidado personal', items:[
        {id:'hidratacion', label:'Hidratación', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'alimentacion', label:'Alimentación', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'ejercicio', label:'Ejercicio físico', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'entrenamiento', label:'Entrenamiento', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'surf', label:'Surf', priority:false, frequency:'daily', days:ALL_DAYS.slice()}
      ]},
      {id:'desarrollo', num:'02', title:'Desarrollo personal', items:[
        {id:'lectura', label:'Lectura', priority:false, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'idioma', label:'Idioma', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'estudio', label:'Investigación / Estudio', priority:false, frequency:'daily', days:ALL_DAYS.slice()}
      ]},
      {id:'admin', num:'03', title:'Actividades administrativas', items:[
        {id:'hogar', label:'Tareas del hogar', priority:true, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'cotidiana', label:'Cotidiana', priority:false, frequency:'daily', days:ALL_DAYS.slice()},
        {id:'adicionales', label:'Adicionales', priority:false, frequency:'daily', days:ALL_DAYS.slice()}
      ]},
      {id:'trabajo', num:'04', title:'Trabajo', items:[
        {id:'ml', label:'ML', priority:true, frequency:'daily', days:WEEKDAYS_ONLY.slice()},
        {id:'amazon', label:'Amazon', priority:false, frequency:'daily', days:WEEKDAYS_ONLY.slice()},
        {id:'otro', label:'Otro', priority:false, frequency:'daily', days:WEEKDAYS_ONLY.slice()},
        {id:'emprendimientos', label:'Emprendimientos', priority:false, frequency:'daily', days:WEEKDAYS_ONLY.slice()}
      ]}
    ];
  }

  function migrateConfig(cfg){
    (cfg || []).forEach(function(cat){
      var legacyWeekdaysOnly = !!cat.weekdaysOnly;
      (cat.items || []).forEach(function(item){
        if(!item.frequency) item.frequency = 'daily';
        if(item.frequency === 'daily' && !item.days){
          item.days = legacyWeekdaysOnly ? WEEKDAYS_ONLY.slice() : ALL_DAYS.slice();
        }
      });
    });
    return cfg;
  }

  var config = [];
  var entries = {};
  var monthlyEntries = {};
  var settings = {startDate:null};
  var goals = [];
  var goalHistory = [];
  var health = {};
  var params = {notes:''};
  var currentTab = 'hoy';
  var openAddItemFor = null;
  var openAddCategory = false;
  var confirmDeleteItem = null;
  var confirmDeleteCat = null;
  var editingFreqFor = null;
  var expandedMonth = null;
  var editingItemLabelFor = null;
  var editingCatTitleFor = null;
  var openAddGoal = false;
  var editingGoal = null;
  var confirmDeleteGoal = null;
  var confirmDeleteHealth = null;
  var healthViewKey = null;
  var openAddFood = false;
  var openAddTraining = false;
  var addFoodError = {msg:null};
  var addTrainingError = {msg:null};
  var editingFoodId = null;
  var editingTrainingId = null;
  var editingSupplementId = null;
  var openAddSupplement = false;
  var addSupplementError = {msg:null};
  var contentEl = document.getElementById('content');
  var dateLabelEl = document.getElementById('date-label');
  var tabsEl = document.getElementById('tabs');
  var storageOk = true;

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseKey(key){ var p = key.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function todayKey(){ return dateKey(new Date()); }
  function isWeekend(d){ var day = d.getDay(); return day===0 || day===6; }
  function isBeforeStart(key){ return !!settings.startDate && key < settings.startDate; }
  function isBeforeHealthStart(key){ return !!settings.healthStartDate && key < settings.healthStartDate; }
  function monthKey(d){ d = d || new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
  function isDayRequired(item, d){
    if(item.frequency === 'monthly') return false;
    var days = item.days || ALL_DAYS;
    return days.indexOf(d.getDay()) > -1;
  }
  function daysTagText(item){
    if(item.frequency === 'monthly') return 'mensual';
    var days = (item.days || ALL_DAYS).slice().sort();
    if(days.length === 0) return 'sin día fijo';
    if(days.length === 7) return null;
    var joined = days.join(',');
    if(joined === '1,2,3,4,5') return 'L\u2013V';
    if(joined === '1,2,3,4,5,6') return 'L\u2013S';
    var abbr = ['D','L','M','X','J','V','S'];
    return days.map(function(d){ return abbr[d]; }).join(',');
  }

  var WEEKDAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
  var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function formatMasthead(){
    var d = new Date();
    dateLabelEl.textContent = WEEKDAYS[d.getDay()]+', '+d.getDate()+' de '+MONTHS[d.getMonth()];
  }
  function formatDateHuman(key){
    var d = parseKey(key);
    return d.getDate()+' de '+MONTHS[d.getMonth()];
  }

  function slugify(str){
    return (str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')) || 'item';
  }
  function allIds(){
    var ids = [];
    config.forEach(function(c){ ids.push(c.id); c.items.forEach(function(i){ ids.push(i.id); }); });
    return ids;
  }
  function uniqueId(base){
    var ids = allIds();
    var id = base, n = 1;
    while(ids.indexOf(id) > -1){ id = base+'-'+n; n++; }
    return id;
  }
  function findCatOfItem(itemId){
    for(var i=0;i<config.length;i++){
      for(var j=0;j<config[i].items.length;j++){
        if(config[i].items[j].id === itemId) return config[i];
      }
    }
    return null;
  }

  function isDayCounted(item, d, key){
    var rec = entries[key] || {};
    var val = rec[item.id];
    if(val === 'skip') return false;
    if(isDayRequired(item, d)) return true;
    return val === true;
  }

  function computeStreak(item){
    var itemId = item.id;
    var streak = 0;
    var d = new Date();
    var tKey = todayKey();
    var includeToday = entries[tKey] && entries[tKey][itemId] === true;
    if(!includeToday){ d.setDate(d.getDate()-1); }
    var guard = 0;
    while(guard < 3650){
      guard++;
      var kCheck = dateKey(d);
      if(isBeforeStart(kCheck)) break;
      var key = dateKey(d);
      var val = entries[key] && entries[key][itemId];
      var required = isDayRequired(item, d);
      if(val === true){
        streak++;
        d.setDate(d.getDate()-1);
        continue;
      }
      if(required){
        if(val === 'skip'){ d.setDate(d.getDate()-1); continue; }
        break;
      }
      d.setDate(d.getDate()-1);
    }
    return streak;
  }

  function dayCompletion(key){
    var d = parseKey(key);
    var rec = entries[key] || {};
    var done = 0, total = 0;
    config.forEach(function(cat){
      cat.items.forEach(function(item){
        if(item.frequency === 'monthly') return;
        if(!isDayCounted(item, d, key)) return;
        total++;
        if(rec[item.id] === true) done++;
      });
    });
    return {done:done, total:total, pct: total ? Math.round((done/total)*100) : 0};
  }

  function last7Days(){
    var days = [];
    for(var i=6;i>=0;i--){
      var d = new Date();
      d.setDate(d.getDate()-i);
      days.push(d);
    }
    return days;
  }

  function rangeStats(days){
    var totalDone=0, totalReq=0, prioDone=0, prioReq=0;
    days.forEach(function(d){
      var key = dateKey(d);
      if(isBeforeStart(key)) return;
      var rec = entries[key] || {};
      config.forEach(function(cat){
        cat.items.forEach(function(item){
          if(item.frequency === 'monthly') return;
          if(!isDayCounted(item, d, key)) return;
          totalReq++;
          if(rec[item.id] === true) totalDone++;
          if(item.priority){
            prioReq++;
            if(rec[item.id] === true) prioDone++;
          }
        });
      });
    });
    return {totalDone:totalDone, totalReq:totalReq, prioDone:prioDone, prioReq:prioReq};
  }

  function weekStats(){
    return rangeStats(last7Days());
  }

  function daysInMonthRange(monthDate){
    var year = monthDate.getFullYear(), month = monthDate.getMonth();
    var first = new Date(year, month, 1);
    var last = new Date(year, month+1, 0);
    var today = new Date(); today.setHours(0,0,0,0);
    if(last > today) last = today;
    var days = [];
    var d = new Date(first);
    while(d <= last){
      days.push(new Date(d));
      d.setDate(d.getDate()+1);
    }
    return days;
  }

  function buildMonthsList(){
    var months = [];
    var cursor = new Date();
    cursor.setDate(1);
    cursor.setHours(0,0,0,0);
    var startMonthKey = settings.startDate ? monthKey(parseKey(settings.startDate)) : monthKey(cursor);
    var guard = 0;
    while(guard < 24){
      guard++;
      months.push(new Date(cursor));
      if(monthKey(cursor) === startMonthKey) break;
      cursor.setMonth(cursor.getMonth()-1);
    }
    return months;
  }

  function allDaysSinceStart(){
    if(!settings.startDate) return [];
    var start = parseKey(settings.startDate);
    var today = new Date();
    today.setHours(0,0,0,0);
    var days = [];
    var d = new Date(start);
    var guard = 0;
    while(d <= today && guard < 3660){
      guard++;
      days.push(new Date(d));
      d.setDate(d.getDate()+1);
    }
    return days;
  }

  function checkIcon(){
    return '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2L4.8 9 10 3" stroke="#EDE7D6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function starIcon(active){
    var fill = active ? 'currentColor' : 'none';
    return '<svg viewBox="0 0 20 20" fill="'+fill+'" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10 2.5l2.3 4.9 5.3.6-3.9 3.7.95 5.3L10 14.4l-4.65 2.6.95-5.3-3.9-3.7 5.3-.6z"/></svg>';
  }
  function trashIcon(){
    return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4.5h4V6M6 6l.6 10a1 1 0 001 .9h4.8a1 1 0 001-.9L14 6"/></svg>';
  }
  function startArrowIcon(){
    return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12M12 5l5 5-5 5"/></svg>';
  }
  function upIcon(){
    return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5-5 5 5"/></svg>';
  }
  function downIcon(){
    return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>';
  }
  function freqIcon(){
    return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="13" height="12" rx="1.5"/><path d="M3.5 8h13M7 3v3M13 3v3"/></svg>';
  }
  function editIcon(){
    return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 3.5l4 4L6 18H2v-4L12.5 3.5z"/></svg>';
  }

  function saveEntries(){
    try{ localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function saveConfig(){
    try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function saveSettings(){
    try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function saveMonthly(){
    try{ localStorage.setItem(MONTHLY_KEY, JSON.stringify(monthlyEntries)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function saveGoals(){
    try{ localStorage.setItem(GOALS_KEY, JSON.stringify(goals)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function saveGoalHistory(){
    try{ localStorage.setItem(GOAL_HISTORY_KEY, JSON.stringify(goalHistory)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function resetHealthCycle(){
    var from = settings.healthStartDate || null;
    var to = todayKey();
    goalHistory.push({
      from: from,
      to: to,
      goals: JSON.parse(JSON.stringify(goals))
    });
    saveGoalHistory();
    settings.healthStartDate = todayKey();
    saveSettings();
  }
  function saveHealth(){
    try{ localStorage.setItem(HEALTH_KEY, JSON.stringify(health)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function saveParams(){
    try{ localStorage.setItem(PARAMS_KEY, JSON.stringify(params)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function daysUntil(dateStr){
    if(!dateStr) return null;
    var target = parseKey(dateStr);
    var today = parseKey(todayKey());
    return Math.round((target - today) / 86400000);
  }

  function toggleItem(itemId){
    var key = todayKey();
    if(!entries[key]) entries[key] = {};
    entries[key][itemId] = !entries[key][itemId];
    saveEntries();
    render();
  }

  function toggleMonthlyItem(itemId){
    var mk = monthKey();
    if(!monthlyEntries[mk]) monthlyEntries[mk] = {};
    monthlyEntries[mk][itemId] = !monthlyEntries[mk][itemId];
    saveMonthly();
    render();
  }

  function findItemById(itemId){
    for(var i=0;i<config.length;i++){
      for(var j=0;j<config[i].items.length;j++){
        if(config[i].items[j].id === itemId) return config[i].items[j];
      }
    }
    return null;
  }

  function moveCategory(catId, dir){
    var idx = config.findIndex(function(c){ return c.id === catId; });
    if(idx === -1) return;
    var newIdx = idx + dir;
    if(newIdx < 0 || newIdx >= config.length) return;
    var tmp = config[idx];
    config[idx] = config[newIdx];
    config[newIdx] = tmp;
    config.forEach(function(c, i){ c.num = pad(i+1); });
    saveConfig();
    render();
  }

  function setItemFrequency(itemId, mode){
    var item = findItemById(itemId);
    if(!item) return;
    if(mode === 'daily-all'){ item.frequency = 'daily'; item.days = ALL_DAYS.slice(); }
    else if(mode === 'daily-weekdays'){ item.frequency = 'daily'; item.days = WEEKDAYS_ONLY.slice(); }
    else if(mode === 'monthly'){ item.frequency = 'monthly'; }
    else if(mode === 'no-schedule'){ item.frequency = 'daily'; item.days = []; }
    saveConfig();
    render();
  }

  function toggleItemDay(itemId, day){
    var item = findItemById(itemId);
    if(!item) return;
    item.frequency = 'daily';
    if(!item.days) item.days = ALL_DAYS.slice();
    var idx = item.days.indexOf(day);
    if(idx > -1){ if(item.days.length > 1) item.days.splice(idx,1); }
    else { item.days.push(day); }
    saveConfig();
    render();
  }

  function addItem(catId, label, errorHolder){
    label = (label || '').trim();
    if(!label){ errorHolder.msg = 'Escribí un nombre para el ítem.'; render(); return; }
    var cat = null;
    for(var i=0;i<config.length;i++){ if(config[i].id === catId){ cat = config[i]; break; } }
    if(!cat) return;
    var id = uniqueId(slugify(label));
    cat.items.push({id:id, label:label, priority:false, frequency:'daily', days:ALL_DAYS.slice()});
    openAddItemFor = null;
    saveConfig();
    render();
  }

  function addCategory(title, errorHolder){
    title = (title || '').trim();
    if(!title){ errorHolder.msg = 'Escribí un nombre para la categoría.'; render(); return; }
    var id = uniqueId(slugify(title));
    var num = pad(config.length + 1);
    config.push({id:id, num:num, title:title, weekdaysOnly:false, items:[]});
    openAddCategory = false;
    saveConfig();
    render();
  }

  function renameItem(itemId, newLabel){
    newLabel = (newLabel || '').trim();
    var item = findItemById(itemId);
    if(!item || !newLabel) { editingItemLabelFor = null; render(); return; }
    item.label = newLabel;
    editingItemLabelFor = null;
    saveConfig();
    render();
  }

  function renameCategory(catId, newTitle){
    newTitle = (newTitle || '').trim();
    var cat = config.find(function(c){ return c.id === catId; });
    if(!cat || !newTitle){ editingCatTitleFor = null; render(); return; }
    cat.title = newTitle;
    editingCatTitleFor = null;
    saveConfig();
    render();
  }

  function togglePriority(itemId){
    var cat = findCatOfItem(itemId);
    if(!cat) return;
    var item = null;
    for(var i=0;i<cat.items.length;i++){ if(cat.items[i].id === itemId){ item = cat.items[i]; break; } }
    if(!item) return;
    item.priority = !item.priority;
    saveConfig();
    render();
  }

  function deleteItemConfirmed(itemId){
    var cat = findCatOfItem(itemId);
    if(!cat) return;
    cat.items = cat.items.filter(function(i){ return i.id !== itemId; });
    confirmDeleteItem = null;
    saveConfig();
    render();
  }

  function deleteCategoryConfirmed(catId){
    config = config.filter(function(c){ return c.id !== catId; });
    confirmDeleteCat = null;
    saveConfig();
    render();
  }

  var addItemError = {msg:null};
  var addCatError = {msg:null};

  // ---------- SALUD: metas ----------
  function addGoal(label, target, date, errorHolder){
    label = (label||'').trim();
    if(!label){ errorHolder.msg = 'Escribí un nombre para la meta.'; render(); return; }
    var id = uniqueId(slugify(label));
    goals.push({id:id, label:label, target:(target||'').trim(), date:(date||'').trim()});
    openAddGoal = false;
    saveGoals();
    render();
  }
  function updateGoal(id, label, target, date){
    var g = goals.find(function(x){ return x.id===id; });
    if(!g) return;
    g.label = (label||'').trim() || g.label;
    g.target = (target||'').trim();
    g.date = (date||'').trim();
    editingGoal = null;
    saveGoals();
    render();
  }
  function deleteGoalConfirmed(id){
    goals = goals.filter(function(g){ return g.id !== id; });
    confirmDeleteGoal = null;
    saveGoals();
    render();
  }

  // ---------- SALUD: registro diario ----------
  var NA_FIELDS = ['peso','cintura','sueno','hidratacion','sensaciones'];
  var BASIC_NA_FIELDS = ['peso','cintura','sueno','hidratacion'];
  function emptyHealthEntry(){
    return {peso:'', cintura:'', sueno:'', hidratacion:'', sensaciones:'', cerrado:false, na:{}, comidas:[], entrenamientos:[], suplementos:[]};
  }
  function getHealthDay(key){
    if(!health[key]) health[key] = emptyHealthEntry();
    if(!health[key].comidas) health[key].comidas = [];
    if(!health[key].entrenamientos) health[key].entrenamientos = [];
    if(!Array.isArray(health[key].suplementos)) health[key].suplementos = [];
    if(!health[key].na) health[key].na = {};
    return health[key];
  }
  function toggleFieldNA(key, field){
    var day = getHealthDay(key);
    day.na[field] = !day.na[field];
    if(day.na[field]) day[field] = '';
    saveHealth();
    render();
  }
  function nowTime(){
    var d = new Date();
    return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();

  function dayTotals(day){
    var cal = 0, prot = 0, activas = 0;
    (day.comidas||[]).forEach(function(e){ if(e.calorias) cal += parseFloat(e.calorias)||0; if(e.proteina) prot += parseFloat(e.proteina)||0; });
    (day.suplementos||[]).forEach(function(e){ if(e.calorias) cal += parseFloat(e.calorias)||0; if(e.proteina) prot += parseFloat(e.proteina)||0; });
    (day.entrenamientos||[]).forEach(function(e){ if(e.calorias) activas += parseFloat(e.calorias)||0; });
    return {calorias: cal, proteina: prot, activas: activas};
  }
  function dayStatusInfo(day){
    var hasData = day.peso || day.cintura || day.sueno || day.hidratacion || day.sensaciones || (day.comidas&&day.comidas.length) || (day.entrenamientos&&day.entrenamientos.length) || (day.suplementos&&day.suplementos.length);
    if(!hasData) return {label:'Sin registrar', cls:'empty'};
    if(day.cerrado) return {label:'Cerrado', cls:'closed'};
    return {label:'En curso', cls:'open'};
  }
  function parseGoalRange(target){
    if(!target) return null;
    var nums = (target.match(/[\d.]+/g)||[]).map(Number);
    if(!nums.length) return null;
    if(nums.length>=2) return {min:nums[0], max:nums[1]};
    return {min:nums[0], max:nums[0]};
  }
  function findGoal(pattern){
    return goals.find(function(g){ return pattern.test(g.label); });
  }
  function progressAgainst(total, range, unit){
    if(!range) return '';
    if(total < range.min) return 'faltan ' + Math.round(range.min-total) + ' ' + unit + ' para el mínimo';
    if(total > range.max) return Math.round(total-range.max) + ' ' + unit + ' por encima del máximo';
    return 'dentro del objetivo';
  }

  function buildSummaryText(key){
    var h = health[key] || emptyHealthEntry();
    var totals = dayTotals(h);
    var status = dayStatusInfo(h);
    var d = parseKey(key);
    var lines = [];
    lines.push('Resumen del ' + d.getDate() + ' de ' + MONTHS[d.getMonth()] + ' (' + status.label + '):');
    if(h.peso) lines.push('Peso: ' + h.peso + ' kg');
    if(h.cintura) lines.push('Cintura: ' + h.cintura + ' cm');
    if(h.sueno) lines.push('Sueño: ' + h.sueno);
    lines.push('');
    lines.push('Comidas del día:');
    if(h.comidas && h.comidas.length){
      h.comidas.forEach(function(e){
        var macro = [];
        if(e.calorias) macro.push(e.calorias+' kcal');
        if(e.proteina) macro.push(e.proteina+'g prot');
        lines.push('- ' + e.hora + ' ' + e.texto + (macro.length? ' ('+macro.join(', ')+')' : ''));
      });
    } else {
      lines.push('- no se cargó ninguna comida todavía');
    }
    lines.push('Total estimado por mí: ' + totals.calorias + ' kcal, ' + totals.proteina + ' g de proteína');
    lines.push('');
    lines.push('Entrenamiento del día:');
    if(h.entrenamientos && h.entrenamientos.length){
      h.entrenamientos.forEach(function(e){
        lines.push('- ' + e.hora + ' ' + e.texto + (e.calorias? ' ('+e.calorias+' kcal activas)':''));
      });
    } else {
      lines.push('- no se registró actividad todavía');
    }
    if(h.hidratacion) lines.push('\nHidratación: ' + h.hidratacion + ' L');
    if(h.suplementos && h.suplementos.length){
      lines.push('Suplementos:');
      h.suplementos.forEach(function(e){
        var macro = [];
        if(e.calorias) macro.push(e.calorias+' kcal');
        if(e.proteina) macro.push(e.proteina+'g prot');
        lines.push('- ' + e.hora + ' ' + e.texto + (macro.length? ' ('+macro.join(', ')+')' : ''));
      });
    }
    if(h.sensaciones) lines.push('Sensaciones/observaciones: ' + h.sensaciones);
    if(goals.length){
      lines.push('');
      lines.push('Mis objetivos actuales:');
      goals.forEach(function(g){
        var extra = g.date ? (' (para ' + formatDateHuman(g.date) + ')') : '';
        lines.push('- ' + g.label + ': ' + (g.target || 'sin definir') + extra);
      });
    }
    if(params.notes){
      lines.push('');
      lines.push('Contexto / parámetros:');
      lines.push(params.notes);
    }
    lines.push('');
    lines.push('¿Podés darme un análisis nutricional aproximado de lo que comí hoy (calorías, proteínas y demás macros), decirme qué me faltaría incorporar para acercarme a mis objetivos, y algún ajuste concreto para lo que me queda del día o para mañana?');
    return lines.join('\n');
  }

  function showToast(msg){
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2200);
  }
  function copySummary(key){
    var text = buildSummaryText(key);
    var done = function(){ showToast('Resumen copiado'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, done){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){ showToast('No se pudo copiar, seleccioná el texto a mano'); }
  }
  function shareSummary(key){
    var text = buildSummaryText(key);
    if(navigator.share){
      navigator.share({title:'Resumen del día', text:text}).catch(function(){});
    } else {
      copySummary(key);
    }
  }

  function renderSemana(){
    var days = last7Days();
    var html = '<div class="empty-note" style="padding:0 0 12px;text-align:left;">'+
      '<span class="priority-dot" style="margin-right:5px;"></span>negrita = prioritario &nbsp;&nbsp;<span class="dot-btn optional" style="width:9px;height:9px;vertical-align:-1px;display:inline-block;"></span> día no obligatorio (igual podés tildarlo) &nbsp;&nbsp;toc\u00e1 un punto: hecho \u2192 excepci\u00f3n (feriado, etc.) \u2192 vac\u00edo</div>';
    html += '<div class="card"><table class="hist-table"><thead><tr><th class="hist-item-label"></th>';
    days.forEach(function(d){
      html += '<th>'+WEEKDAYS[d.getDay()]+'<br>'+d.getDate()+'</th>';
    });
    html += '</tr></thead><tbody>';
    config.forEach(function(cat){
      var dailyItems = cat.items.filter(function(i){ return i.frequency !== 'monthly'; });
      if(!dailyItems.length) return;
      html += '<tr class="hist-cat-row"><td colspan="'+(days.length+1)+'"><span class="card-num">'+cat.num+'</span> '+cat.title+'</td></tr>';
      dailyItems.forEach(function(item){
        html += '<tr><td class="hist-item-label'+(item.priority?' is-priority':'')+'">'+item.label+'</td>';
        days.forEach(function(d){
          var key = dateKey(d);
          if(isBeforeStart(key)){
            html += '<td><span class="dot na"></span></td>';
            return;
          }
          var required = isDayRequired(item, d);
          var state = entries[key] && entries[key][item.id];
          var cls = state === true ? 'on' : (state === 'skip' ? 'skip' : '');
          if(!required) cls += ' optional';
          var label = state === true ? 'hecho' : (state === 'skip' ? 'excepción' : 'sin marcar');
          if(!required) label += ', no obligatorio';
          html += '<td><button class="dot-btn '+cls+'" data-toggleitem="'+item.id+'" data-toggledate="'+key+'" data-required="'+(required?'1':'0')+'" aria-label="'+item.label+' '+key+' ('+label+')"></button></td>';
        });
        html += '</tr>';
      });
    });
    html += '</tbody></table></div>';
    contentEl.innerHTML = html;
    contentEl.querySelectorAll('.dot-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var itemId = btn.getAttribute('data-toggleitem');
        var key = btn.getAttribute('data-toggledate');
        var required = btn.getAttribute('data-required') === '1';
        if(!entries[key]) entries[key] = {};
        var cur = entries[key][itemId];
        if(required){
          if(cur === true){ entries[key][itemId] = 'skip'; }
          else if(cur === 'skip'){ delete entries[key][itemId]; }
          else { entries[key][itemId] = true; }
        } else {
          if(cur === true){ delete entries[key][itemId]; }
          else { entries[key][itemId] = true; }
        }
        saveEntries();
        renderSemana();
      });
    });
  }

  function renderResumen(){
    var stats = weekStats();
    var pct = stats.totalReq ? Math.round((stats.totalDone/stats.totalReq)*100) : 0;
    var prioPct = stats.prioReq ? Math.round((stats.prioDone/stats.prioReq)*100) : 0;
    var html = '';

    html += '<div class="card" style="text-align:center;padding:24px 18px 20px;">';
    html += '<div class="metric-label" style="font-size:12.5px;">Prioritarios \u00b7 \u00faltimos 7 d\u00edas</div>';
    html += '<div class="metric-value" style="font-size:42px;margin:6px 0 2px;">'+prioPct+'%</div>';
    html += '<div class="metric-label">'+stats.prioDone+' de '+stats.prioReq+' cumplidos</div>';
    html += '</div>';

    html += '<div class="card"><div class="card-head"><span class="card-title" style="font-size:15px;">Detalle de prioritarios</span></div>';
    var days = last7Days();
    var any = false;
    config.forEach(function(cat){
      cat.items.forEach(function(item){
        if(!item.priority || item.frequency === 'monthly') return;
        any = true;
        var req = 0, done = 0;
        days.forEach(function(d){
          var key = dateKey(d);
          if(isBeforeStart(key)) return;
          if(!isDayCounted(item, d, key)) return;
          var rec = entries[key] || {};
          req++;
          if(rec[item.id] === true) done++;
        });
        var streak = computeStreak(item);
        html += '<div class="prio-row"><span class="priority-dot"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+done+'/'+req+' \u00b7 '+streak+'d racha</span></div>';
      });
    });
    if(!any) html += '<div class="empty-note" style="color:var(--ink-soft);">Todavía no marcaste ítems como prioritarios.</div>';
    html += '</div>';

    html += '<div class="metric-row">';
    html += '<div class="metric-card"><div class="metric-label">Cumplimiento general (7 d\u00edas)</div><div class="metric-value" style="font-size:20px;">'+pct+'%</div></div>';
    html += '</div>';

    var monthlyItems = [];
    config.forEach(function(cat){
      cat.items.forEach(function(item){ if(item.frequency === 'monthly') monthlyItems.push(item); });
    });
    if(monthlyItems.length){
      var mk = monthKey();
      html += '<div class="card"><div class="card-head"><span class="card-title" style="font-size:15px;">Mensuales</span><span class="card-count">'+MONTHS[new Date().getMonth()]+'</span></div>';
      monthlyItems.forEach(function(item){
        var done = !!(monthlyEntries[mk] && monthlyEntries[mk][item.id]);
        html += '<div class="prio-row"><span class="dot '+(done?'on':'')+'" style="margin-right:2px;"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+(done?'Hecho este mes':'Pendiente')+'</span></div>';
      });
      html += '</div>';
    }
    contentEl.innerHTML = html;
  }

          if(expandedMonth === mk){

              var req = 0, done = 0;
              days.forEach(function(d){
                var key = dateKey(d);
                if(isBeforeStart(key)) return;
                if(!isDayCounted(item, d, key)) return;
                var rec = entries[key] || {};
                req++;
                if(rec[item.id] === true) done++;
              });
              html += '<div class="prio-row"><span class="priority-dot"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+done+'/'+req+'</span></div>';

          html += '<div class="prio-row"><span class="dot '+(done?'on':'')+'" style="margin-right:2px;"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+(done?'Hecho':'No hecho')+'</span></div>';
        });

    });

  // ---------- SALUD: sub-render Semana (solo datos) ----------
  function renderSemanaSalud(){
    var days = last7Days();
    var html = '<div class="empty-note" style="padding:0 0 12px;text-align:left;">'+
      '<span class="dot on" style="width:9px;height:9px;vertical-align:-1px;display:inline-block;"></span> cerrado &nbsp;&nbsp;<span class="dot" style="width:9px;height:9px;vertical-align:-1px;display:inline-block;"></span> en curso &nbsp;&nbsp;<span class="dot na" style="width:9px;height:9px;vertical-align:-1px;display:inline-block;"></span> sin registrar</div>';
    html += '<div class="card"><table class="hist-table"><thead><tr><th class="hist-item-label"></th>';
    days.forEach(function(d){
      html += '<th>'+WEEKDAYS[d.getDay()]+'<br>'+d.getDate()+'</th>';
    });
    html += '</tr></thead><tbody>';

    var rows = [
      {label:'Peso', get:function(h){ return h.peso ? h.peso+' kg' : '—'; }},
      {label:'Cintura', get:function(h){ return h.cintura ? h.cintura+' cm' : '—'; }},
      {label:'Cal. consumidas', get:function(h){ return dayTotals(h).calorias || '—'; }},
      {label:'Cal. activas', get:function(h){ return dayTotals(h).activas || '—'; }},
      {label:'Proteína', get:function(h){ var p = dayTotals(h).proteina; return p ? p+'g' : '—'; }},
      {label:'Hidratación', get:function(h){ return h.hidratacion ? h.hidratacion+' L' : '—'; }}
    ];
    rows.forEach(function(r){
      html += '<tr><td class="hist-item-label">'+r.label+'</td>';
      days.forEach(function(d){
        var k = dateKey(d);
        var h = health[k] || emptyHealthEntry();
        html += '<td>'+r.get(h)+'</td>';
      });
      html += '</tr>';
    });

    html += '<tr><td class="hist-item-label">Estado</td>';
    days.forEach(function(d){
      var k = dateKey(d);
      var h = health[k] || emptyHealthEntry();
      var status = dayStatusInfo(h);
      var cls = status.cls === 'closed' ? 'on' : (status.cls === 'empty' ? 'na' : '');
      html += '<td><span class="dot '+cls+'" title="'+status.label+'"></span></td>';
    });
    html += '</tr>';

    html += '</tbody></table></div>';
    contentEl.innerHTML = html;
  }

  // ---------- SALUD: sub-render Resumen (evolución, informativa) ----------
  function renderResumenSalud(){
    var keys = Object.keys(health).sort().filter(function(k){ return !isBeforeHealthStart(k); });
    var pesoKeys = keys.filter(function(k){ return health[k].peso; });
    var cinturaKeys = keys.filter(function(k){ return health[k].cintura; });
    var html = '';

    var cycleLabel = settings.healthStartDate ? formatDateHuman(settings.healthStartDate) : formatDateHuman(todayKey());
    html += '<div class="empty-note" style="text-align:left;padding:0 0 12px;color:rgba(237,231,214,0.6);">Evolución del ciclo actual, desde el <strong style="color:var(--paper);">'+cycleLabel+'</strong>.</div>';
    html += '<div class="card"><div class="card-head"><span class="card-title" style="font-size:15px;">Evolución</span></div>';
    if(pesoKeys.length){
      var firstPesoKey = pesoKeys[0], lastPesoKey = pesoKeys[pesoKeys.length-1];
      var firstPeso = parseFloat(health[firstPesoKey].peso), lastPeso = parseFloat(health[lastPesoKey].peso);
      var delta = (lastPeso - firstPeso).toFixed(1);
      html += '<div class="prio-row"><span class="prio-name">Peso: '+firstPeso+'kg ('+formatDateHuman(firstPesoKey)+') → '+lastPeso+'kg ('+formatDateHuman(lastPesoKey)+')</span><span class="prio-ratio">'+(delta>=0?'+':'')+delta+'kg</span></div>';
      var pesoGoal = goals.find(function(g){ return g.id==='peso' || /peso/i.test(g.label); });
      if(pesoGoal){
        var targetNum = parseFloat(pesoGoal.target);
        if(!isNaN(targetNum)){
          var falta = (lastPeso - targetNum).toFixed(1);
          var dleft = daysUntil(pesoGoal.date);
          html += '<div class="prio-row"><span class="prio-name">Meta: '+pesoGoal.target+(pesoGoal.date?' para '+formatDateHuman(pesoGoal.date):'')+'</span><span class="prio-ratio">'+(falta>0?'faltan '+falta+'kg':'¡meta alcanzada!')+(dleft!==null&&dleft>=0?' · '+dleft+'d':'')+'</span></div>';
        }
      }
    } else {
      html += '<div class="empty-note" style="color:var(--ink-soft);">Todavía no cargaste ningún peso en el registro diario.</div>';
    }
    if(cinturaKeys.length){
      var firstCKey = cinturaKeys[0], lastCKey = cinturaKeys[cinturaKeys.length-1];
      html += '<div class="prio-row"><span class="prio-name">Cintura: '+health[firstCKey].cintura+'cm ('+formatDateHuman(firstCKey)+') → '+health[lastCKey].cintura+'cm ('+formatDateHuman(lastCKey)+')</span></div>';
    }
    html += '</div>';

    var days7 = last7Days();
    var calSum=0, calCount=0, protSum=0, protCount=0, loggedDays=0, closedDays=0;
    days7.forEach(function(d){
      var k = dateKey(d);
      var h = health[k];
      if(h){
        var totals = dayTotals(h);
        var status = dayStatusInfo(h);
        if(status.cls !== 'empty') loggedDays++;
        if(status.cls === 'closed') closedDays++;
        if(totals.calorias){ calSum += totals.calorias; calCount++; }
        if(totals.proteina){ protSum += totals.proteina; protCount++; }
      }
    });
    html += '<div class="card"><div class="card-head"><span class="card-title" style="font-size:15px;">Últimos 7 días</span></div>';
    html += '<div class="prio-row"><span class="prio-name">Días con registro cargado</span><span class="prio-ratio">'+loggedDays+'/7</span></div>';
    html += '<div class="prio-row"><span class="prio-name">Días cerrados</span><span class="prio-ratio">'+closedDays+'/7</span></div>';
    html += '<div class="prio-row"><span class="prio-name">Promedio calorías (días con dato)</span><span class="prio-ratio">'+(calCount? Math.round(calSum/calCount) : '—')+'</span></div>';
    html += '<div class="prio-row"><span class="prio-name">Promedio proteína (días con dato)</span><span class="prio-ratio">'+(protCount? Math.round(protSum/protCount)+'g' : '—')+'</span></div>';
    html += '</div>';

    html += '<div class="card"><div class="card-head"><span class="card-title" style="font-size:15px;">Detalle diario</span></div>';
    var days7b = last7Days().slice().reverse();
    days7b.forEach(function(d){
      var k = dateKey(d);
      var h = health[k] || emptyHealthEntry();
      var totals = dayTotals(h);
      var isOpen = expandedHealthDay === k;
      html += '<div class="entry-row" style="cursor:pointer;" data-toggledaydetail="'+k+'"><span class="entry-time">'+(isOpen?'−':'+')+'</span><span class="entry-main">'+formatDateHuman(k)+'<span class="entry-macros">'+totals.calorias+' kcal consumidas · '+totals.proteina+'g proteína</span></span></div>';
      if(isOpen){
        html += '<div style="padding:0 0 10px 20px;">';
        html += '<div class="field-label" style="margin-top:6px;">Comidas</div>';
        if(h.comidas && h.comidas.length){
          h.comidas.forEach(function(e){
            var macro = [];
            if(e.calorias) macro.push(e.calorias+' kcal');
            if(e.proteina) macro.push(e.proteina+'g prot');
            html += '<div class="entry-row"><span class="entry-time">'+e.hora+'</span><span class="entry-main">'+e.texto+(macro.length?'<span class="entry-macros">'+macro.join(' · ')+'</span>':'')+'</span></div>';
          });
        } else {
          html += '<div class="empty-note" style="padding:4px 0;color:var(--ink-soft);">Sin comidas cargadas.</div>';
        }
        html += '<div class="field-label">Entrenamiento</div>';
        if(h.entrenamientos && h.entrenamientos.length){
          h.entrenamientos.forEach(function(e){
            html += '<div class="entry-row"><span class="entry-time">'+e.hora+'</span><span class="entry-main">'+e.texto+(e.calorias?'<span class="entry-macros">'+e.calorias+' kcal activas</span>':'')+'</span></div>';
          });
        } else {
          html += '<div class="empty-note" style="padding:4px 0;color:var(--ink-soft);">Sin actividad cargada.</div>';
        }
        if(h.suplementos && h.suplementos.length){
          html += '<div class="field-label">Suplementos</div>';
          h.suplementos.forEach(function(e){
            var macro = [];
            if(e.calorias) macro.push(e.calorias+' kcal');
            if(e.proteina) macro.push(e.proteina+'g prot');
            html += '<div class="entry-row"><span class="entry-time">'+e.hora+'</span><span class="entry-main">'+e.texto+(macro.length?'<span class="entry-macros">'+macro.join(' · ')+'</span>':'')+'</span></div>';
          });
        }
        html += '</div>';
      }
    });
    html += '</div>';

    if(goalHistory && goalHistory.length){
      html += '<div class="card"><div class="card-head"><span class="card-title" style="font-size:15px;">Ciclos anteriores</span></div>';
      goalHistory.slice().reverse().forEach(function(cycle, idx){
        var isOpen = expandedCycle === (goalHistory.length - 1 - idx);
        var realIdx = goalHistory.length - 1 - idx;
        var fromLabel = cycle.from ? formatDateHuman(cycle.from) : 'inicio';
        html += '<div class="entry-row" style="cursor:pointer;" data-togglecycle="'+realIdx+'"><span class="entry-time">'+(isOpen?'−':'+')+'</span><span class="entry-main">'+fromLabel+' → '+formatDateHuman(cycle.to)+'</span></div>';
        if(isOpen){
          html += '<div style="padding:0 0 10px 20px;">';
          if(cycle.goals && cycle.goals.length){
            cycle.goals.forEach(function(g){
              html += '<div class="goal-row"><span class="goal-main"><span class="goal-label">'+g.label+'</span><span class="goal-detail">'+(g.target||'sin definir')+'</span></span></div>';
            });
          } else {
            html += '<div class="empty-note" style="padding:4px 0;color:var(--ink-soft);">Sin metas registradas en ese ciclo.</div>';
          }
          html += '</div>';
        }
      });
      html += '</div>';
    }

    contentEl.innerHTML = html;
    contentEl.querySelectorAll('[data-toggledaydetail]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.getAttribute('data-toggledaydetail');
        expandedHealthDay = (expandedHealthDay === k) ? null : k;
        renderResumenSalud();
      });
    });
    contentEl.querySelectorAll('[data-togglecycle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-togglecycle'), 10);
        expandedCycle = (expandedCycle === idx) ? null : idx;
        renderResumenSalud();
      });
    });
  }
  var expandedHealthDay = null;
  var expandedCycle = null;

  var currentMainTab = 'objetivos';
  var objetivosSubTab = 'hoy';
  var saludSubTab = 'metas';

  var SUBTABS = {
    objetivos: [
      {id:'hoy', label:'Hoy'},
      {id:'semana', label:'Semana'},
      {id:'resumen', label:'Resumen'},
      {id:'meses', label:'Meses'}
    ],
    salud: [
      {id:'metas', label:'Metas'},
      {id:'dia', label:'Día'},
      {id:'semana', label:'Semana'},
      {id:'resumen', label:'Resumen'}
    ]
  };

  var subtabsEl = document.getElementById('subtabs');

  function renderSubTabs(){
    var list = SUBTABS[currentMainTab];
    var active = currentMainTab === 'objetivos' ? objetivosSubTab : saludSubTab;
    var html = '';
    list.forEach(function(t){
      html += '<button class="tab'+(t.id===active?' active':'')+'" data-subtab="'+t.id+'">'+t.label+'</button>';
    });
    subtabsEl.innerHTML = html;
    subtabsEl.querySelectorAll('[data-subtab]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-subtab');
        if(currentMainTab === 'objetivos'){ objetivosSubTab = id; } else { saludSubTab = id; }
        renderSubTabs();
        render();
      });
    });
  }

  function render(){
    contentEl.className = '';
    if(!settings.startDate){ subtabsEl.innerHTML=''; renderStartScreen(); return; }
    if(currentMainTab === 'objetivos'){
      currentTab = objetivosSubTab;
      if(objetivosSubTab === 'hoy'){ renderHoy(); }
      else if(objetivosSubTab === 'semana'){ renderSemana(); }
      else if(objetivosSubTab === 'resumen'){ renderResumen(); }
      else { renderMeses(); }
    } else {
      if(saludSubTab === 'metas'){ renderMetas(); }
      else if(saludSubTab === 'dia'){ renderDia(); }
      else if(saludSubTab === 'semana'){ renderSemanaSalud(); }
      else { renderResumenSalud(); }
    }
  }

  function setMainTab(tab, btn){
    currentMainTab = tab;
    document.querySelectorAll('#tabs .tab').forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');
    renderSubTabs();
    render();
  }

  document.getElementById('tab-main-objetivos').addEventListener('click', function(){ setMainTab('objetivos', this); });
  document.getElementById('tab-main-salud').addEventListener('click', function(){ setMainTab('salud', this); });

  var pendingImport = null;
  var importPanel = document.getElementById('import-panel');

  function exportData(){
    var payload = {config:config, entries:entries, monthlyEntries:monthlyEntries, settings:settings, goals:goals, goalHistory:goalHistory, health:health, params:params, exportedAt: todayKey()};
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'objetivos-personales-'+todayKey()+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function renderImportConfirm(){
    if(!pendingImport){ importPanel.innerHTML = ''; return; }
    var when = pendingImport.exportedAt ? formatDateHuman(pendingImport.exportedAt) : 'fecha desconocida';
    importPanel.innerHTML = '<div class="confirm-block">Este archivo es del '+when+'. Va a reemplazar todo tu progreso actual (categorías, ítems y días marcados). Esta acción no se puede deshacer.'+
      '<div class="confirm-actions"><button class="btn-danger" id="confirm-import">Sí, reemplazar</button><button class="add-cancel" id="cancel-import">Cancelar</button></div></div>';
    document.getElementById('confirm-import').addEventListener('click', function(){
      config = pendingImport.config || defaultConfig();
      migrateConfig(config);
      entries = pendingImport.entries || {};
      monthlyEntries = pendingImport.monthlyEntries || {};
      settings = pendingImport.settings || {startDate:null};
      goals = pendingImport.goals || defaultGoals();
      goalHistory = pendingImport.goalHistory || [];
      health = pendingImport.health || {};
      params = pendingImport.params || {notes: defaultParamsNotes()};
      saveConfig(); saveEntries(); saveMonthly(); saveSettings(); saveGoals(); saveGoalHistory(); saveHealth(); saveParams();
      pendingImport = null;
      importPanel.innerHTML = '';
      tabsEl.style.display = settings.startDate ? 'flex' : 'none';
      currentMainTab = 'objetivos';
      objetivosSubTab = 'hoy';
      document.querySelectorAll('#tabs .tab').forEach(function(t){ t.classList.remove('active'); });
      document.getElementById('tab-main-objetivos').classList.add('active');
      renderSubTabs();
      render();
    });
    document.getElementById('cancel-import').addEventListener('click', function(){
      pendingImport = null;
      importPanel.innerHTML = '';
      document.getElementById('import-file').value = '';
    });
  }

  function handleImportFile(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var parsed = JSON.parse(ev.target.result);
        if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.config) || typeof parsed.entries !== 'object'){
          importPanel.innerHTML = '<div class="empty-note" style="color:var(--coral);">Este archivo no tiene el formato esperado.</div>';
          return;
        }
        pendingImport = parsed;
        renderImportConfirm();
      }catch(err){
        importPanel.innerHTML = '<div class="empty-note" style="color:var(--coral);">No se pudo leer el archivo. ¿Es un .json exportado desde acá?</div>';
      }
    };
    reader.readAsText(file);
  }

  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', function(){ document.getElementById('import-file').click(); });
  document.getElementById('import-file').addEventListener('change', handleImportFile);

  function init(){
    formatMasthead();
    try{
      var cfgRaw = localStorage.getItem(CONFIG_KEY);
      config = cfgRaw ? JSON.parse(cfgRaw) : null;
    }catch(e){ config = null; storageOk = false; }
    if(!config){ config = defaultConfig(); }
    migrateConfig(config);
    saveConfig();
    try{
      var entRaw = localStorage.getItem(ENTRIES_KEY);
      entries = entRaw ? JSON.parse(entRaw) : {};
    }catch(e){ entries = {}; storageOk = false; }
    try{
      var monRaw = localStorage.getItem(MONTHLY_KEY);
      monthlyEntries = monRaw ? JSON.parse(monRaw) : {};
    }catch(e){ monthlyEntries = {}; storageOk = false; }
    try{
      var setRaw = localStorage.getItem(SETTINGS_KEY);
      settings = setRaw ? JSON.parse(setRaw) : {startDate:null};
    }catch(e){ settings = {startDate:null}; storageOk = false; }
    try{
      var goalsRaw = localStorage.getItem(GOALS_KEY);
      goals = goalsRaw ? JSON.parse(goalsRaw) : null;
    }catch(e){ goals = null; storageOk = false; }
    if(!goals){ goals = defaultGoals(); saveGoals(); }
    try{
      var goalHistRaw = localStorage.getItem(GOAL_HISTORY_KEY);
      goalHistory = goalHistRaw ? JSON.parse(goalHistRaw) : [];
    }catch(e){ goalHistory = []; storageOk = false; }
    if(!settings.healthStartDate){
      settings.healthStartDate = settings.startDate || todayKey();
      saveSettings();
    }
    try{
      var healthRaw = localStorage.getItem(HEALTH_KEY);
      health = healthRaw ? JSON.parse(healthRaw) : {};
    }catch(e){ health = {}; storageOk = false; }
    try{
      var paramsRaw = localStorage.getItem(PARAMS_KEY);
      params = paramsRaw ? JSON.parse(paramsRaw) : null;
    }catch(e){ params = null; storageOk = false; }
    if(!params){ params = {notes: defaultParamsNotes()}; saveParams(); }
    if(settings.startDate){ tabsEl.style.display = 'flex'; }
    renderSubTabs();
    render();
  }

  init();
})();
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(e){ console.error('SW error', e); });
  });
}
</script>
</body>
</html>
