<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Objetivos personales</title>
<meta name="theme-color" content="#16241F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Objetivos">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#16241F;
    --paper:#EDE7D6;
    --paper-2:#E3DCC7;
    --ink:#1B2B24;
    --ink-soft:#4B5A52;
    --ocean:#2F6F8F;
    --ocean-dark:#1F4E66;
    --gold:#B9862E;
    --gold-light:#EFDBAF;
    --coral:#B9634A;
    --line: rgba(27,43,36,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:'Inter',sans-serif;}
  .app{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--paper);
    padding:calc(28px + env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom));
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
  }
  .masthead{
    border-bottom:1px solid rgba(237,231,214,0.25);
    padding-bottom:16px;
    margin-bottom:20px;
  }
  .masthead h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 4px;
    letter-spacing:0.2px;
  }
  .masthead .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:rgba(237,231,214,0.65);
    text-transform:capitalize;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:20px;
  }
  .tab{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid rgba(237,231,214,0.25);
    background:transparent;
    color:rgba(237,231,214,0.75);
    cursor:pointer;
  }
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    border-color:var(--paper);
  }
  .gauge-wrap{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:24px;
  }
  .gauge{
    width:64px;
    height:64px;
    border-radius:50%;
    background:conic-gradient(var(--gold) calc(var(--pct) * 1%), rgba(237,231,214,0.14) 0);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .gauge-inner{
    width:50px;
    height:50px;
    border-radius:50%;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .gauge-label{
    font-size:13px;
    color:rgba(237,231,214,0.75);
    line-height:1.5;
  }
  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    padding:16px 18px 8px;
    margin-bottom:14px;
  }
  .card-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .card-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ocean-dark);
    font-weight:500;
  }
  .card-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:16px;
    flex:1;
  }
  .card-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--ocean-dark);
    background:rgba(47,111,143,0.12);
    padding:2px 6px;
    border-radius:8px;
  }
  .card-count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .item-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .checkbox{
    width:22px;
    height:22px;
    border-radius:5px;
    border:1.5px solid var(--ocean-dark);
    flex-shrink:0;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    transition:background 0.15s ease, border-color 0.15s ease;
  }
  .checkbox.checked{
    background:var(--ocean);
    border-color:var(--ocean);
  }
  .checkbox svg{width:13px;height:13px;display:none;}
  .checkbox.checked svg{display:block;}
  .item-label{
    flex:1;
    font-size:14px;
  }
  .item-note{
    font-size:11px;
    color:var(--ink-soft);
    display:block;
  }
  .priority-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--gold);
    display:inline-block;
    margin-right:6px;
    flex-shrink:0;
    vertical-align:middle;
  }
  .item-row.done .item-label{
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:rgba(27,43,36,0.35);
  }
  .streak{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--gold);
    min-width:30px;
    text-align:right;
  }
  .streak.zero{color:rgba(27,43,36,0.3);}
  .empty-note{
    font-size:13px;
    color:rgba(237,231,214,0.6);
    text-align:center;
    padding:20px 0;
  }
  .add-link{
    display:block;
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    color:var(--ocean-dark);
    padding:9px 0;
    cursor:pointer;
  }
  .add-link-cat{
    color:var(--paper);
    text-align:center;
    font-size:13px;
    padding:10px 0;
    border:1px dashed rgba(237,231,214,0.3);
    border-radius:10px;
  }
  .add-row{
    display:flex;
    gap:6px;
    padding:8px 0;
    flex-wrap:wrap;
  }
  .add-input{
    flex:1;
    min-width:120px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  .add-confirm, .add-cancel{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    padding:8px 12px;
    border-radius:6px;
    border:1px solid var(--ocean-dark);
    background:var(--ocean);
    color:var(--paper);
    cursor:pointer;
  }
  .add-cancel{
    background:transparent;
    color:var(--ink-soft);
    border-color:var(--line);
  }
  .add-error{
    font-size:11.5px;
    color:var(--coral);
    width:100%;
  }
  .row-actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .icon-btn{
    width:28px;
    height:28px;
    border:none;
    background:transparent;
    color:rgba(27,43,36,0.4);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:6px;
    flex-shrink:0;
  }
  .icon-btn svg{width:15px;height:15px;}
  .icon-btn.star-btn.active{color:var(--gold);}
  .icon-btn.trash-btn:hover{color:var(--coral);}
  .cat-head-actions{
    display:flex;
    align-items:center;
    gap:2px;
    flex-shrink:0;
  }
  .confirm-item-row{
    background:rgba(185,99,74,0.08);
    border-radius:6px;
    padding:8px 8px;
  }
  .confirm-item-row span{font-size:13px;flex:1;}
  .btn-danger, .btn-danger-sm{
    font-family:'Inter',sans-serif;
    padding:6px 12px;
    border-radius:6px;
    border:1px solid var(--coral);
    background:var(--coral);
    color:#fff;
    cursor:pointer;
    font-size:12.5px;
  }
  .btn-danger-sm{padding:5px 10px;font-size:12px;}
  .confirm-block{
    font-size:13px;
    color:var(--ink-soft);
    padding:6px 0 12px;
  }
  .confirm-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .hist-table{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
  }
  .hist-table th{
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    color:var(--ink-soft);
    padding:4px 2px;
    text-align:center;
  }
  .hist-table td{
    text-align:center;
    padding:6px 2px;
  }
  .hist-item-label{
    text-align:left !important;
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding-right:6px !important;
    white-space:nowrap;
  }
  .dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:1.3px solid var(--ocean-dark);
    display:inline-block;
  }
  .dot.on{
    background:var(--gold);
    border-color:var(--gold);
  }
  .dot.na{
    border:1.3px dashed rgba(27,43,36,0.25);
    background:transparent;
  }
  .hist-item-label.is-priority{
    font-weight:600;
  }
  .hist-cat-row td{
    background:var(--paper-2);
    text-align:left !important;
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:12.5px;
    color:var(--ocean-dark);
    padding:7px 6px !important;
  }
  .metric-row{
    display:flex;
    gap:12px;
    margin-bottom:14px;
  }
  .metric-card{
    flex:1;
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    padding:14px 16px;
  }
  .metric-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .metric-value{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
  }
  .prio-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .prio-row:last-child{border-bottom:none;}
  .prio-name{flex:1;}
  .prio-ratio{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ocean-dark);
  }
  .link-btn{
    background:transparent;
    border:none;
    color:var(--gold-light);
    text-decoration:underline;
    font-size:12.5px;
    cursor:pointer;
    padding:0;
  }
  .start-screen{
    text-align:center;
    padding:48px 20px;
  }
  .start-screen h2{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:21px;
    margin:0 0 10px;
  }
  .start-screen p{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0 0 22px;
  }
  .start-screen button{
    padding:12px 26px;
    font-size:14.5px;
  }
  .start-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 30px;
    border-radius:999px;
    border:none;
    background:var(--gold);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.12s ease;
  }
  .start-btn svg{width:16px;height:16px;}
  .start-btn:active{transform:scale(0.96);background:#A5761F;}
  .reset-row{
    text-align:center;
    padding:6px 0 0;
  }
  .reset-row .link-btn{color:rgba(237,231,214,0.5);}
  .loading{
    text-align:center;
    padding:40px 0;
    color:rgba(237,231,214,0.6);
    font-size:13px;
  }
  .backup-row{
    text-align:center;
    padding:18px 0 0;
    font-size:12px;
    color:rgba(237,231,214,0.45);
  }
  .backup-row .link-btn{
    color:rgba(237,231,214,0.55);
  }
  .backup-sep{margin:0 8px;color:rgba(237,231,214,0.25);}
  .import-panel{
    margin-top:12px;
  }
  .import-panel .confirm-block{
    background:var(--paper);
    border-radius:10px;
    padding:14px 16px;
  }
  @media (max-width:480px){
    .app{padding:20px 12px 40px;}
    .card{padding:14px 14px 6px;}
    .masthead h1{font-size:21px;}
    .hist-table{font-size:10px;}
    .metric-row{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <h1>Objetivos personales</h1>
    <div class="date" id="date-label">—</div>
  </div>
  <div class="tabs" id="tabs" style="display:none;">
    <button class="tab active" id="tab-hoy">Hoy</button>
    <button class="tab" id="tab-semana">Semana</button>
    <button class="tab" id="tab-resumen">Resumen</button>
  </div>
  <div id="content" class="loading">Cargando…</div>
  <div class="backup-row">
    <button class="link-btn" id="export-btn">Exportar copia</button>
    <span class="backup-sep">·</span>
    <button class="link-btn" id="import-btn">Importar copia</button>
    <input type="file" id="import-file" accept="application/json" style="display:none;">
    <div class="import-panel" id="import-panel"></div>
  </div>
</div>
<script>
(function(){
  var CONFIG_KEY = 'op_config';
  var ENTRIES_KEY = 'op_entries';
  var SETTINGS_KEY = 'op_settings';

  function defaultConfig(){
    return [
      {id:'cuidado', num:'01', title:'Cuidado personal', weekdaysOnly:false, items:[
        {id:'hidratacion', label:'Hidratación', priority:true},
        {id:'alimentacion', label:'Alimentación', priority:true},
        {id:'ejercicio', label:'Ejercicio físico', priority:true},
        {id:'entrenamiento', label:'Entrenamiento', priority:true},
        {id:'surf', label:'Surf', priority:false}
      ]},
      {id:'desarrollo', num:'02', title:'Desarrollo personal', weekdaysOnly:false, items:[
        {id:'lectura', label:'Lectura', priority:false},
        {id:'idioma', label:'Idioma', priority:true},
        {id:'estudio', label:'Investigación / Estudio', priority:false}
      ]},
      {id:'admin', num:'03', title:'Actividades administrativas', weekdaysOnly:false, items:[
        {id:'hogar', label:'Tareas del hogar', priority:true},
        {id:'cotidiana', label:'Cotidiana', priority:false},
        {id:'adicionales', label:'Adicionales', priority:false}
      ]},
      {id:'trabajo', num:'04', title:'Trabajo', weekdaysOnly:true, items:[
        {id:'ml', label:'ML', priority:true},
        {id:'amazon', label:'Amazon', priority:false},
        {id:'otro', label:'Otro', priority:false},
        {id:'emprendimientos', label:'Emprendimientos', priority:false}
      ]}
    ];
  }

  var config = [];
  var entries = {};
  var settings = {startDate:null};
  var currentTab = 'hoy';
  var openAddItemFor = null;
  var openAddCategory = false;
  var confirmDeleteItem = null;
  var confirmDeleteCat = null;
  var contentEl = document.getElementById('content');
  var dateLabelEl = document.getElementById('date-label');
  var tabsEl = document.getElementById('tabs');
  var storageOk = true;

  function pad(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parseKey(key){ var p = key.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function todayKey(){ return dateKey(new Date()); }
  function isWeekend(d){ var day = d.getDay(); return day===0 || day===6; }
  function isBeforeStart(key){ return !!settings.startDate && key < settings.startDate; }

  var WEEKDAYS = ['dom','lun','mar','mié','jue','vie','sáb'];
  var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  function formatMasthead(){
    var d = new Date();
    dateLabelEl.textContent = WEEKDAYS[d.getDay()]+', '+d.getDate()+' de '+MONTHS[d.getMonth()];
  }
  function formatDateHuman(key){
    var d = parseKey(key);
    return d.getDate()+' de '+MONTHS[d.getMonth()];
  }

  function slugify(str){
    return (str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')) || 'item';
  }
  function allIds(){
    var ids = [];
    config.forEach(function(c){ ids.push(c.id); c.items.forEach(function(i){ ids.push(i.id); }); });
    return ids;
  }
  function uniqueId(base){
    var ids = allIds();
    var id = base, n = 1;
    while(ids.indexOf(id) > -1){ id = base+'-'+n; n++; }
    return id;
  }
  function findCatOfItem(itemId){
    for(var i=0;i<config.length;i++){
      for(var j=0;j<config[i].items.length;j++){
        if(config[i].items[j].id === itemId) return config[i];
      }
    }
    return null;
  }

  function computeStreak(itemId, weekdaysOnly){
    var streak = 0;
    var d = new Date();
    var tKey = todayKey();
    var includeToday = entries[tKey] && entries[tKey][itemId] === true;
    if(!includeToday){ d.setDate(d.getDate()-1); }
    var guard = 0;
    while(guard < 3650){
      guard++;
      var kCheck = dateKey(d);
      if(isBeforeStart(kCheck)) break;
      if(weekdaysOnly && isWeekend(d)){ d.setDate(d.getDate()-1); continue; }
      var key = dateKey(d);
      if(entries[key] && entries[key][itemId] === true){
        streak++;
        d.setDate(d.getDate()-1);
      } else { break; }
    }
    return streak;
  }

  function dayCompletion(key){
    var d = parseKey(key);
    var weekend = isWeekend(d);
    var rec = entries[key] || {};
    var done = 0, total = 0;
    config.forEach(function(cat){
      cat.items.forEach(function(item){
        if(cat.weekdaysOnly && weekend) return;
        total++;
        if(rec[item.id]) done++;
      });
    });
    return {done:done, total:total, pct: total ? Math.round((done/total)*100) : 0};
  }

  function last7Days(){
    var days = [];
    for(var i=6;i>=0;i--){
      var d = new Date();
      d.setDate(d.getDate()-i);
      days.push(d);
    }
    return days;
  }

  function weekStats(){
    var days = last7Days();
    var totalDone=0, totalReq=0, prioDone=0, prioReq=0;
    days.forEach(function(d){
      var weekend = isWeekend(d);
      var key = dateKey(d);
      if(isBeforeStart(key)) return;
      var rec = entries[key] || {};
      config.forEach(function(cat){
        cat.items.forEach(function(item){
          if(cat.weekdaysOnly && weekend) return;
          totalReq++;
          if(rec[item.id]) totalDone++;
          if(item.priority){
            prioReq++;
            if(rec[item.id]) prioDone++;
          }
        });
      });
    });
    return {totalDone:totalDone, totalReq:totalReq, prioDone:prioDone, prioReq:prioReq};
  }

  function checkIcon(){
    return '<svg viewBox="0 0 12 12" fill="none"><path d="M2 6.2L4.8 9 10 3" stroke="#EDE7D6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function starIcon(active){
    var fill = active ? 'currentColor' : 'none';
    return '<svg viewBox="0 0 20 20" fill="'+fill+'" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10 2.5l2.3 4.9 5.3.6-3.9 3.7.95 5.3L10 14.4l-4.65 2.6.95-5.3-3.9-3.7 5.3-.6z"/></svg>';
  }
  function trashIcon(){
    return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4.5h4V6M6 6l.6 10a1 1 0 001 .9h4.8a1 1 0 001-.9L14 6"/></svg>';
  }
  function startArrowIcon(){
    return '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h12M12 5l5 5-5 5"/></svg>';
  }

  function saveEntries(){
    try{ localStorage.setItem(ENTRIES_KEY, JSON.stringify(entries)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function saveConfig(){
    try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }
  function saveSettings(){
    try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
    catch(e){ console.error('No se pudo guardar', e); storageOk = false; }
  }

  function toggleItem(itemId){
    var key = todayKey();
    if(!entries[key]) entries[key] = {};
    entries[key][itemId] = !entries[key][itemId];
    saveEntries();
    render();
  }

  function addItem(catId, label, errorHolder){
    label = (label || '').trim();
    if(!label){ errorHolder.msg = 'Escribí un nombre para el ítem.'; render(); return; }
    var cat = null;
    for(var i=0;i<config.length;i++){ if(config[i].id === catId){ cat = config[i]; break; } }
    if(!cat) return;
    var id = uniqueId(slugify(label));
    cat.items.push({id:id, label:label, priority:false});
    openAddItemFor = null;
    saveConfig();
    render();
  }

  function addCategory(title, errorHolder){
    title = (title || '').trim();
    if(!title){ errorHolder.msg = 'Escribí un nombre para la categoría.'; render(); return; }
    var id = uniqueId(slugify(title));
    var num = pad(config.length + 1);
    config.push({id:id, num:num, title:title, weekdaysOnly:false, items:[]});
    openAddCategory = false;
    saveConfig();
    render();
  }

  function togglePriority(itemId){
    var cat = findCatOfItem(itemId);
    if(!cat) return;
    var item = null;
    for(var i=0;i<cat.items.length;i++){ if(cat.items[i].id === itemId){ item = cat.items[i]; break; } }
    if(!item) return;
    item.priority = !item.priority;
    saveConfig();
    render();
  }

  function deleteItemConfirmed(itemId){
    var cat = findCatOfItem(itemId);
    if(!cat) return;
    cat.items = cat.items.filter(function(i){ return i.id !== itemId; });
    confirmDeleteItem = null;
    saveConfig();
    render();
  }

  function deleteCategoryConfirmed(catId){
    config = config.filter(function(c){ return c.id !== catId; });
    confirmDeleteCat = null;
    saveConfig();
    render();
  }

  var addItemError = {msg:null};
  var addCatError = {msg:null};

  function renderStartScreen(){
    tabsEl.style.display = 'none';
    var html = '<div class="card start-screen">';
    html += '<h2>Arrancá tu plan</h2>';
    html += '<p>Vas a marcar tus actividades día a día y ver tus rachas y tu cumplimiento en el tiempo.<br>Cuando toques el botón, hoy queda fijado como el día 1.</p>';
    html += '<button class="add-confirm" id="start-plan-btn">Comenzar hoy</button>';
    html += '</div>';
    if(!storageOk){
      html += '<div class="empty-note">Este navegador está bloqueando el guardado local (modo privado o cookies desactivadas). Tus datos no se van a conservar entre visitas.</div>';
    }
    contentEl.innerHTML = html;
    document.getElementById('start-plan-btn').addEventListener('click', function(){
      settings.startDate = todayKey();
      saveSettings();
      tabsEl.style.display = 'flex';
      render();
    });
  }

  function renderHoy(){
    var key = todayKey();
    var comp = dayCompletion(key);
    var html = '';
    var startLabel = formatDateHuman(settings.startDate);
    html += '<div class="empty-note" style="text-align:left;padding:0 0 16px;">Plan desde el <strong style="color:var(--paper);">'+startLabel+'</strong> · <button class="link-btn" id="reset-start">reiniciar</button></div>';

    html += '<div class="gauge-wrap">';
    html += '<div class="gauge" style="--pct:'+comp.pct+'"><div class="gauge-inner">'+comp.pct+'%</div></div>';
    html += '<div class="gauge-label">'+comp.done+' de '+comp.total+' cumplidas hoy'+(comp.done===0 ? '.<br>Todavía no marcaste nada.' : '.')+'</div>';
    html += '</div>';

    config.forEach(function(cat){
      var rec = entries[key] || {};
      var catDone = 0;
      cat.items.forEach(function(i){ if(rec[i.id]) catDone++; });
      html += '<div class="card">';
      html += '<div class="card-head"><span class="card-num">'+cat.num+'</span><span class="card-title">'+cat.title+'</span>';
      if(cat.weekdaysOnly) html += '<span class="card-tag">solo L\u2013V</span>';
      html += '<span class="card-count">'+catDone+'/'+cat.items.length+'</span>';
      html += '<span class="cat-head-actions"><button class="icon-btn trash-btn" data-delcat="'+cat.id+'" aria-label="Eliminar categoría '+cat.title+'">'+trashIcon()+'</button></span>';
      html += '</div>';

      if(confirmDeleteCat === cat.id){
        html += '<div class="confirm-block">¿Eliminar "'+cat.title+'" y sus '+cat.items.length+' ítems? Esta acción no se puede deshacer.';
        html += '<div class="confirm-actions"><button class="btn-danger" data-confirmdelcat="'+cat.id+'">Sí, eliminar</button><button class="add-cancel" data-canceldelcat="'+cat.id+'">Cancelar</button></div></div>';
        html += '</div>';
        return;
      }

      var weekend = isWeekend(new Date());
      cat.items.forEach(function(item){
        if(confirmDeleteItem === item.id){
          html += '<div class="item-row confirm-item-row"><span>¿Eliminar "'+item.label+'"?</span>';
          html += '<button class="btn-danger-sm" data-confirmdelitem="'+item.id+'">Sí</button>';
          html += '<button class="add-cancel" data-canceldelitem="'+item.id+'">No</button></div>';
          return;
        }
        var checked = rec[item.id];
        var streak = computeStreak(item.id, cat.weekdaysOnly);
        var notRequired = cat.weekdaysOnly && weekend;
        html += '<div class="item-row '+(checked?'done':'')+'">';
        html += '<button class="checkbox '+(checked?'checked':'')+'" data-item="'+item.id+'" aria-label="'+item.label+'">'+checkIcon()+'</button>';
        html += '<span class="item-label">'+(item.priority?'<span class="priority-dot" title="Prioritario"></span>':'')+item.label+(notRequired?'<span class="item-note">No obligatorio el fin de semana</span>':'')+'</span>';
        html += '<span class="streak '+(streak===0?'zero':'')+'">'+(streak>0 ? streak+'d' : '\u2014')+'</span>';
        html += '<span class="row-actions">';
        html += '<button class="icon-btn star-btn '+(item.priority?'active':'')+'" data-star="'+item.id+'" aria-label="Marcar como prioritario">'+starIcon(item.priority)+'</button>';
        html += '<button class="icon-btn trash-btn" data-delitem="'+item.id+'" aria-label="Eliminar ítem">'+trashIcon()+'</button>';
        html += '</span>';
        html += '</div>';
      });

      if(openAddItemFor === cat.id){
        html += '<div class="add-row">';
        html += '<input type="text" class="add-input" id="new-item-input" placeholder="Nombre del ítem" />';
        html += '<button class="add-confirm" id="confirm-add-item" data-cat="'+cat.id+'">Agregar</button>';
        html += '<button class="add-cancel" id="cancel-add-item">Cancelar</button>';
        if(addItemError.msg) html += '<span class="add-error">'+addItemError.msg+'</span>';
        html += '</div>';
      } else {
        html += '<button class="add-link" data-addcat="'+cat.id+'">+ agregar ítem</button>';
      }
      html += '</div>';
    });

    if(openAddCategory){
      html += '<div class="card"><div class="add-row">';
      html += '<input type="text" class="add-input" id="new-cat-input" placeholder="Nombre de la categoría" />';
      html += '<button class="add-confirm" id="confirm-add-category">Agregar</button>';
      html += '<button class="add-cancel" id="cancel-add-category">Cancelar</button>';
      if(addCatError.msg) html += '<span class="add-error">'+addCatError.msg+'</span>';
      html += '</div></div>';
    } else {
      html += '<button class="add-link add-link-cat" id="open-add-category">+ nueva categoría</button>';
    }

    contentEl.innerHTML = html;

    var resetBtn = document.getElementById('reset-start');
    if(resetBtn){
      resetBtn.addEventListener('click', function(){
        settings.startDate = null;
        saveSettings();
        render();
      });
    }
    contentEl.querySelectorAll('.checkbox').forEach(function(btn){
      btn.addEventListener('click', function(){ toggleItem(btn.getAttribute('data-item')); });
    });
    contentEl.querySelectorAll('.star-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ togglePriority(btn.getAttribute('data-star')); });
    });
    contentEl.querySelectorAll('.trash-btn[data-delitem]').forEach(function(btn){
      btn.addEventListener('click', function(){ confirmDeleteItem = btn.getAttribute('data-delitem'); render(); });
    });
    contentEl.querySelectorAll('[data-confirmdelitem]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteItemConfirmed(btn.getAttribute('data-confirmdelitem')); });
    });
    contentEl.querySelectorAll('[data-canceldelitem]').forEach(function(btn){
      btn.addEventListener('click', function(){ confirmDeleteItem = null; render(); });
    });
    contentEl.querySelectorAll('.trash-btn[data-delcat]').forEach(function(btn){
      btn.addEventListener('click', function(){ confirmDeleteCat = btn.getAttribute('data-delcat'); render(); });
    });
    contentEl.querySelectorAll('[data-confirmdelcat]').forEach(function(btn){
      btn.addEventListener('click', function(){ deleteCategoryConfirmed(btn.getAttribute('data-confirmdelcat')); });
    });
    contentEl.querySelectorAll('[data-canceldelcat]').forEach(function(btn){
      btn.addEventListener('click', function(){ confirmDeleteCat = null; render(); });
    });
    contentEl.querySelectorAll('.add-link[data-addcat]').forEach(function(btn){
      btn.addEventListener('click', function(){
        openAddItemFor = btn.getAttribute('data-addcat');
        addItemError.msg = null;
        render();
      });
    });
    var confirmItemBtn = document.getElementById('confirm-add-item');
    if(confirmItemBtn){
      confirmItemBtn.addEventListener('click', function(){
        var val = document.getElementById('new-item-input').value;
        addItem(confirmItemBtn.getAttribute('data-cat'), val, addItemError);
      });
    }
    var cancelItemBtn = document.getElementById('cancel-add-item');
    if(cancelItemBtn){
      cancelItemBtn.addEventListener('click', function(){ openAddItemFor = null; addItemError.msg = null; render(); });
    }
    var openCatBtn = document.getElementById('open-add-category');
    if(openCatBtn){
      openCatBtn.addEventListener('click', function(){ openAddCategory = true; addCatError.msg = null; render(); });
    }
    var confirmCatBtn = document.getElementById('confirm-add-category');
    if(confirmCatBtn){
      confirmCatBtn.addEventListener('click', function(){
        var val = document.getElementById('new-cat-input').value;
        addCategory(val, addCatError);
      });
    }
    var cancelCatBtn = document.getElementById('cancel-add-category');
    if(cancelCatBtn){
      cancelCatBtn.addEventListener('click', function(){ openAddCategory = false; addCatError.msg = null; render(); });
    }
  }

  function renderSemana(){
    var days = last7Days();
    var html = '<div class="empty-note" style="padding:0 0 12px;text-align:left;">'+
      '<span class="priority-dot" style="margin-right:5px;"></span>negrita = prioritario &nbsp;&nbsp;<span class="dot na" style="width:9px;height:9px;vertical-align:-1px;"></span> no obligatorio / antes del inicio</div>';
    html += '<div class="card"><table class="hist-table"><thead><tr><th class="hist-item-label"></th>';
    days.forEach(function(d){
      html += '<th>'+WEEKDAYS[d.getDay()]+'<br>'+d.getDate()+'</th>';
    });
    html += '</tr></thead><tbody>';
    config.forEach(function(cat){
      html += '<tr class="hist-cat-row"><td colspan="'+(days.length+1)+'"><span class="card-num">'+cat.num+'</span>'+cat.title+(cat.weekdaysOnly?' <span class="card-tag">L\u2013V</span>':'')+'</td></tr>';
      cat.items.forEach(function(item){
        html += '<tr><td class="hist-item-label'+(item.priority?' is-priority':'')+'">'+item.label+'</td>';
        days.forEach(function(d){
          var weekend = isWeekend(d);
          var key = dateKey(d);
          if(isBeforeStart(key)){
            html += '<td><span class="dot na" title="Antes del inicio del plan"></span></td>';
          } else if(cat.weekdaysOnly && weekend){
            html += '<td><span class="dot na"></span></td>';
          } else {
            var on = entries[key] && entries[key][item.id];
            html += '<td><span class="dot '+(on?'on':'')+'"></span></td>';
          }
        });
        html += '</tr>';
      });
    });
    html += '</tbody></table></div>';
    contentEl.innerHTML = html;
  }

  function renderResumen(){
    var stats = weekStats();
    var pct = stats.totalReq ? Math.round((stats.totalDone/stats.totalReq)*100) : 0;
    var prioPct = stats.prioReq ? Math.round((stats.prioDone/stats.prioReq)*100) : 0;
    var html = '';
    html += '<div class="metric-row">';
    html += '<div class="metric-card"><div class="metric-label">Cumplimiento general (7 días)</div><div class="metric-value">'+pct+'%</div></div>';
    html += '<div class="metric-card"><div class="metric-label">Prioritarios (7 días)</div><div class="metric-value">'+prioPct+'%</div></div>';
    html += '</div>';

    html += '<div class="card"><div class="card-head"><span class="card-title" style="font-size:15px;">Detalle de prioritarios</span></div>';
    var days = last7Days();
    var any = false;
    config.forEach(function(cat){
      cat.items.forEach(function(item){
        if(!item.priority) return;
        any = true;
        var req = 0, done = 0;
        days.forEach(function(d){
          var weekend = isWeekend(d);
          var key = dateKey(d);
          if(isBeforeStart(key)) return;
          if(cat.weekdaysOnly && weekend) return;
          req++;
          if(entries[key] && entries[key][item.id]) done++;
        });
        var streak = computeStreak(item.id, cat.weekdaysOnly);
        html += '<div class="prio-row"><span class="priority-dot"></span><span class="prio-name">'+item.label+'</span><span class="prio-ratio">'+done+'/'+req+' \u00b7 '+streak+'d racha</span></div>';
      });
    });
    if(!any) html += '<div class="empty-note">Todavía no marcaste ítems como prioritarios.</div>';
    html += '</div>';
    contentEl.innerHTML = html;
  }

  function render(){
    if(!settings.startDate){ renderStartScreen(); return; }
    if(currentTab === 'hoy'){ renderHoy(); }
    else if(currentTab === 'semana'){ renderSemana(); }
    else { renderResumen(); }
  }

  function setActiveTab(tab, btn){
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    btn.classList.add('active');
    render();
  }

  document.getElementById('tab-hoy').addEventListener('click', function(){ setActiveTab('hoy', this); });
  document.getElementById('tab-semana').addEventListener('click', function(){ setActiveTab('semana', this); });
  document.getElementById('tab-resumen').addEventListener('click', function(){ setActiveTab('resumen', this); });

  var pendingImport = null;
  var importPanel = document.getElementById('import-panel');

  function exportData(){
    var payload = {config:config, entries:entries, settings:settings, exportedAt: todayKey()};
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'objetivos-personales-'+todayKey()+'.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function renderImportConfirm(){
    if(!pendingImport){ importPanel.innerHTML = ''; return; }
    var when = pendingImport.exportedAt ? formatDateHuman(pendingImport.exportedAt) : 'fecha desconocida';
    importPanel.innerHTML = '<div class="confirm-block">Este archivo es del '+when+'. Va a reemplazar todo tu progreso actual (categorías, ítems y días marcados). Esta acción no se puede deshacer.'+
      '<div class="confirm-actions"><button class="btn-danger" id="confirm-import">Sí, reemplazar</button><button class="add-cancel" id="cancel-import">Cancelar</button></div></div>';
    document.getElementById('confirm-import').addEventListener('click', function(){
      config = pendingImport.config || defaultConfig();
      entries = pendingImport.entries || {};
      settings = pendingImport.settings || {startDate:null};
      saveConfig(); saveEntries(); saveSettings();
      pendingImport = null;
      importPanel.innerHTML = '';
      tabsEl.style.display = settings.startDate ? 'flex' : 'none';
      currentTab = 'hoy';
      document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
      document.getElementById('tab-hoy').classList.add('active');
      render();
    });
    document.getElementById('cancel-import').addEventListener('click', function(){
      pendingImport = null;
      importPanel.innerHTML = '';
      document.getElementById('import-file').value = '';
    });
  }

  function handleImportFile(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{
        var parsed = JSON.parse(ev.target.result);
        if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.config) || typeof parsed.entries !== 'object'){
          importPanel.innerHTML = '<div class="empty-note" style="color:var(--coral);">Este archivo no tiene el formato esperado.</div>';
          return;
        }
        pendingImport = parsed;
        renderImportConfirm();
      }catch(err){
        importPanel.innerHTML = '<div class="empty-note" style="color:var(--coral);">No se pudo leer el archivo. ¿Es un .json exportado desde acá?</div>';
      }
    };
    reader.readAsText(file);
  }

  document.getElementById('export-btn').addEventListener('click', exportData);
  document.getElementById('import-btn').addEventListener('click', function(){ document.getElementById('import-file').click(); });
  document.getElementById('import-file').addEventListener('change', handleImportFile);

  function init(){
    formatMasthead();
    try{
      var cfgRaw = localStorage.getItem(CONFIG_KEY);
      config = cfgRaw ? JSON.parse(cfgRaw) : null;
    }catch(e){ config = null; storageOk = false; }
    if(!config){ config = defaultConfig(); saveConfig(); }
    try{
      var entRaw = localStorage.getItem(ENTRIES_KEY);
      entries = entRaw ? JSON.parse(entRaw) : {};
    }catch(e){ entries = {}; storageOk = false; }
    try{
      var setRaw = localStorage.getItem(SETTINGS_KEY);
      settings = setRaw ? JSON.parse(setRaw) : {startDate:null};
    }catch(e){ settings = {startDate:null}; storageOk = false; }
    if(settings.startDate){ tabsEl.style.display = 'flex'; }
    render();
  }

  init();
})();
</script>
</body>
</html>
